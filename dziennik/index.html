<style>

async function sendMsg(){
  const set=new Set();
  FV.to.forEach(k=>{if(k.startsWith('p:'))return set.add(k.slice(2));const[a,b,c]=k.split(':');Object.values(P).forEach(p=>{if(p.id===me.id)return;if(a==='role'&&p.role===b)set.add(p.id);if(a==='class'&&p.role===c&&inClass(p.id,b))set.add(p.id)})});
  if(!set.size||!v('sub').trim()||!v('body').trim())return warn('Wybierz odbiorców i uzupełnij temat oraz treść.');
  const clsOf=pid=>{const p=P[pid];return p.role==='student'?[ST[pid]?.class_id]:p.role==='parent'?PC.filter(r=>r.parent_id===pid).map(r=>ST[r.student_id]?.class_id):[]};
  const cc=new Set();
  if(FV.cc_dir)Object.values(P).filter(p=>p.role==='director').forEach(p=>cc.add(p.id));
  if(FV.cc_home){const cl=new Set([...clsOf(me.id),...[...set].flatMap(clsOf)]);C.filter(c=>cl.has(c.id)&&c.homeroom_teacher_id).forEach(c=>cc.add(c.homeroom_teacher_id))}
  cc.delete(me.id);

  const ccn=[...cc].map(nm),body=v('body').trim()+(cc.size?'\n\n[Kopia do: '+ccn.join(', ')+']':'');

}

  if(!FV.tc.length||!FV.ts.length)return warn('Wybierz przedmioty i klasy.');if(!rows.length)return warn('Te przydziały już istnieją.');

AD.plan=async back=>{

  const [{data:tt},{data:ta}]=await Promise.all([cid?sb.from('timetable').select('*').eq('class_id',cid):{data:[]},sb.from('timetable').select('*')]);window.TT=tt;window.TTA=ta||[];
  return pn('Plan lekcji',`<div style="max-width:300px" class="mb-3"><label class="lb">Klasa</label>${dd('plc',C.map(c=>[c.id,'Klasa '+c.name]),cid,{on:x=>{curC=x;rr()}})}</div>
   ${cid?tbl(['Lekcja',...DAYS.slice(1)],LNS().map(n=>`<tr><td><span class="av">${n}</span></td>${[1,2,3,4,5].map(d=>{const e=tt.find(x=>x.weekday===d&&x.lesson_no===n),t=e&&T.find(x=>x.id===e.teaching_id);return `<td class="cell" onclick="editCell(${d},${n})">${t?`<b>${esc(sn(t.subject_id))}</b><br><span class="text-xs mu">${esc(nm(t.teacher_id))}</span>`:`<span class="mu" style="opacity:.5">${ic('plus')}</span>`}</td>`}).join('')}</tr>`))+'<p class="text-xs mu mt-3">Kliknij komórkę, aby ustawić lub wyczyścić lekcję.</p>':'<p class="em">Najpierw dodaj klasę.</p>'}`,back,'pl')};

function editCell(d,n){const e=TT.find(x=>x.weekday===d&&x.lesson_no===n),ts=T.filter(t=>t.class_id===curC);

   <div class="flex gap-2 justify-end mt-4">${e?`<button class="gh red" onclick="setCell(${d},${n},'')">Wyczyść</button>`:''}<button class="gh" onclick="closeModal()">Anuluj</button>${ts.length?`<button class="btn" onclick="setCell(${d},${n},FV.cell)">Zapisz</button>`:''}</div></div>`)}
async function setCell(d,n,tid){const e=TT.find(x=>x.weekday===d&&x.lesson_no===n);if(tid===undefined||(tid===''&&!e)){closeModal();return}
  if(tid){const t=T.find(x=>x.id===tid),bz=busyOf(t,d,n);if(bz)return warn(nm(t.teacher_id)+' ma już o tej godzinie lekcję ('+bz.replace('⚠ zajęty: ','')+'). Nie można go wpisać do dwóch klas naraz.')}
  if(e){const r=await sb.from('timetable').delete().eq('id',e.id);if(r.error)return warn(r.error.message)}
  if(tid){const r=await sb.from('timetable').insert({class_id:curC,teaching_id:tid,weekday:d,lesson_no:n});if(r.error)return warn(r.error.message)}
  closeModal();toast('Zapisano plan');rr()}

AD.chg=async back=>{
  const tch=Object.values(P).filter(p=>['teacher','director'].includes(p.role)).sort((a,b)=>ln(a.id).localeCompare(ln(b.id),'pl'));
  const opts=[...C.map(c=>['c:'+c.id,'Klasa '+c.name]),...tch.map(p=>['t:'+p.id,'Nauczyciel: '+ln(p.id)])];
  if(!chSel||!opts.some(o=>o[0]===chSel))chSel=opts[0]?opts[0][0]:'';
  const isT=chSel.startsWith('t:'),id=chSel.slice(2);
  let data=[];
  if(id){const tids=isT?T.filter(t=>t.teacher_id===id).map(t=>t.id):[];
    if(!isT||tids.length){const q=sb.from('timetable').select('*'),r=await(isT?q.in('teaching_id',tids):q.eq('class_id',id));if(r.error)throw r.error;data=r.data}}
  const es=id?entries(data,wk,isT?(r=>T.find(t=>t.id===r.teaching_id)?.teacher_id===id||r.sub===id):(r=>r.class_id===id)):[];
  const grid=weekGrid(es,(e,t)=>{const a=`'${e.class_id}','${e.d}',${e.n},'${e.teaching_id}'`,oc=e.st?`chEditAt(${a},'${e.st}')`:`chPick(${a})`;
    return `<div class="lsn pk${e.st==='cancel'||e.st==='moved'?' x':''}" title="${e.st?'Kliknij, aby edytować lub usunąć zmianę':'Kliknij, aby odwołać, zastąpić lub przenieść lekcję'}" onclick="${oc}"><div class="lt">${(BELLS[e.n-1]||[]).join(' - ')}</div><b>${esc(sn(e.subj||t?.subject_id))}</b><div class="text-xs">${isT?(e.st==='sub'?esc(nm(e.sub))+' · ':'')+'klasa '+esc(cn(e.class_id)):esc(nm(e.sub||t?.teacher_id))}</div>${chTag(e)}</div>`});
  return pn('Zmiany w planie',`<div style="max-width:360px" class="mb-3"><label class="lb">Klasa lub nauczyciel</label>${dd('chs0',opts,chSel,{on:x=>{chSel=x;rr()}})}</div><p class="text-sm mu mb-3">Kliknij lekcję, aby ją odwołać, zastąpić lub przenieść. Kliknij lekcję z pastylką zmiany, aby ją edytować lub usunąć.</p>${grid}`,wkNav(),'pl')};
function chEditAt(cid,d,n,tid,st){let k;
  if(st==='in'){const mi=CH.find(x=>x.kind==='moved_in'&&x.class_id===cid&&x.date===d&&x.lesson_no===n&&x.teaching_id===tid);k=mi&&CH.find(x=>x.kind==='moved_out'&&x.grp===mi.grp)}
  else k=CH.find(x=>x.class_id===cid&&x.date===d&&x.lesson_no===n&&x.teaching_id===tid&&(st==='cancel'?x.kind==='cancelled':st==='moved'?x.kind==='moved_out':x.kind==='substitution'));
  if(!k)return warn('Nie znaleziono tej zmiany.');chEdit(k.id)}
const delChg=async(id,g)=>await ask('Usunąć tę zmianę w planie?','Usuń')&&act(g?sb.from('timetable_changes').delete().eq('grp',g):sb.from('timetable_changes').delete().eq('id',id),reload,'Usunięto zmianę');
function chPick(cid,d,n,tid){
  const t=T.find(x=>x.id===tid),L=LNS().map(i=>[i,'Lekcja '+i]),
   tch=Object.values(P).filter(p=>['teacher','director'].includes(p.role)).sort((a,b)=>ln(a.id).localeCompare(ln(b.id),'pl')).map(p=>[p.id,ln(p.id)]);
  modal(`<div class="box"><h3 class="mh">${ic('pl')} Zmiana lekcji</h3>
   <dl class="dl mb-3"><dt>Klasa</dt><dd>${esc(cn(cid))}</dd><dt>Data</dt><dd>${fdl(d)}</dd><dt>Lekcja</dt><dd>${n} (${(BELLS[n-1]||[]).join(' - ')})</dd><dt>Przedmiot</dt><dd>${esc(sn(t?.subject_id))}</dd><dt>Nauczyciel</dt><dd>${esc(nm(t?.teacher_id))}</dd></dl>
   <label class="lb">Co chcesz zrobić?</label>
   ${seg('ck',[['cancelled','Odwołaj'],['substitution','Zastępstwo'],['moved','Przenieś']],'cancelled',k=>{$('#chs').style.display=k==='substitution'?'':'none';$('#chm').style.display=k==='moved'?'':'none'})}
   <div id="chs" class="mt-3" style="display:none"><label class="lb">Nauczyciel zastępujący</label>${dd('ct2',tch,'',{ph:'Wybierz nauczyciela…'})}<label class="lb mt-3">Przedmiot na zastępstwie (opcjonalnie)</label>${dd('cs2',[['','Ten sam przedmiot'],...SUB.map(x=>[x.id,x.name])],'')}</div>
   <div id="chm" class="grid grid-cols-2 gap-3 mt-3" style="display:none"><div><label class="lb">Przenieś na dzień</label>${dp('md','')}</div><div><label class="lb">Na lekcję</label>${dd('mn2',L,n)}</div></div>

function saveChg(cid,d,n,tid){const k=FV.ck,okd=q=>{const x=new Date(q+'T12:00');return x.getDay()%6!==0&&!hol(x)};
  if(k==='substitution'&&!FV.ct2)return warn('Wybierz nauczyciela zastępującego.');
  if(k==='moved'&&(!FV.md||!okd(FV.md)))return warn('Wybierz dzień roboczy (nie wolny), na który przenosisz lekcję.');
  if(CH.some(x=>x.class_id===cid&&x.date===d&&x.lesson_no===n&&x.kind!=='moved_in'))return warn('Ta lekcja ma już zmianę. Usuń ją najpierw.');
  const b={school_id:me.school_id,class_id:cid,date:d,lesson_no:n,teaching_id:tid,note:v('cnt2').trim()||null};let rows;
  if(k==='substitution')rows=[{...b,kind:'substitution',sub_teacher_id:FV.ct2,sub_subject_id:FV.cs2||null}];
  else if(k==='cancelled')rows=[{...b,kind:'cancelled'}];
  else{const g=crypto.randomUUID();rows=[{...b,kind:'moved_out',grp:g},{...b,kind:'moved_in',date:FV.md,lesson_no:+FV.mn2,grp:g}]}

  const [tt,ab]=await Promise.all([sb.from('timetable').select('*'),sb.from('teacher_absences').select('*').lte('date',d2)]);
  const abs=(ab.data||[]).filter(x=>(x.date_to||x.date)>=d1),mt=T.filter(x=>x.teacher_id===t).map(x=>x.id),tchs=Object.values(P).filter(p=>['teacher','director'].includes(p.role)),taken=new Set();ABP=[];
  for(const d of days){
    const all=entries(tt.data||[],mon(new Date(d+'T12:00')),r=>r.d===d),mine=all.filter(r=>!r.st&&mt.includes(r.teaching_id)&&r.n>=a&&r.n<=b).sort((x,y)=>x.n-y.n);
    for(const r of mine){
      const live=all.filter(x=>x.n===r.n&&x.st!=='cancel'&&x.st!=='moved'),busy=new Set(live.map(x=>x.st==='sub'?x.sub:T.find(y=>y.id===x.teaching_id)?.teacher_id)),
       away=new Set([t,...abs.filter(x=>x.date<=d&&(x.date_to||x.date)>=d&&x.lesson_from<=r.n&&x.lesson_to>=r.n).map(x=>x.teacher_id)]),
       free=tchs.filter(p=>!busy.has(p.id)&&!away.has(p.id)&&!taken.has(d+'|'+r.n+'|'+p.id)),
       cl=all.filter(x=>x.class_id===r.class_id&&x.st!=='cancel'&&x.st!=='moved').map(x=>x.n),edge=r.n===Math.min(...cl)||r.n===Math.max(...cl),
       subj=T.find(y=>y.id===r.teaching_id)?.subject_id,same=free.filter(p=>T.some(y=>y.teacher_id===p.id&&y.subject_id===subj)),
       pk=edge?null:(same[0]||free[0]),sj={};
      /* przedmiot na zastępstwie: ten sam, jeśli zastępca go uczy; inaczej jego przedmiot w tej klasie; inaczej jego pierwszy przedmiot */
      free.forEach(p=>{const m=T.filter(y=>y.teacher_id===p.id);sj[p.id]=(m.find(y=>y.subject_id===subj)||m.find(y=>y.class_id===r.class_id)||m[0])?.subject_id||null});
      if(pk)taken.add(d+'|'+r.n+'|'+pk.id);
      ABP.push({r,d,free,same,edge,sj,subj,def:pk?'sub:'+pk.id:'cancel'})}}
  if(!ABP.length){$('#abx').innerHTML='<p class="em">Ten nauczyciel nie ma lekcji w wybranym czasie.</p>';return}
  const gr={};ABP.forEach((p,i)=>(gr[p.d]??=[]).push([p,i]));
  $('#abx').innerHTML=`<div class="sec"><b>Propozycje zastępstw</b><p class="text-xs mu mb-1">Skrajne lekcje klasy są domyślnie odwołane, pozostałe dostają zastępcę. Zmień, co chcesz.</p>`
   +Object.keys(gr).sort().map(d=>`<div class="mt-3"><div class="text-sm font-semibold mb-1">${fdl(d)}</div>`+gr[d].map(([p,i])=>`<div class="flex flex-wrap items-center gap-3 py-2 border-b" style="border-color:var(--ln)"><span class="av">${p.r.n}</span><div class="flex-1" style="min-width:150px"><b>${esc(cn(p.r.class_id))} · ${esc(sn(p.subj))}</b><div class="text-xs mu">${(BELLS[p.r.n-1]||[]).join(' - ')}${p.edge?' · skrajna lekcja':''}</div></div><div style="min-width:260px">${dd('abp'+i,[['','Bez zmian'],['cancel','Odwołaj lekcję'],...p.free.map(f=>['sub:'+f.id,nm(f.id),(p.sj[f.id]?sn(p.sj[f.id]):'zastępstwo')+(p.same.includes(f)?' ✓':'')])],p.def,{sm:1})}</div></div>`).join('')+'</div>').join('')
   +`<button class="btn mt-4" onclick="absSave()">Zapisz nieobecność i zmiany w planie</button></div>`}
async function absSave(){
  const t=FV.abt,d1=FV.abd,d2=FV.abd2||d1,why=FV.abr,note='Nieobecność: '+nm(t)+(why?' ('+why+')':'');
  const r0=await sb.from('teacher_absences').insert({school_id:me.school_id,teacher_id:t,date:d1,date_to:d2,lesson_from:+FV.ab1,lesson_to:+FV.ab2,reason:why,created_by:me.id});if(r0.error)return warn(r0.error.message);
  const rows=ABP.map((p,i)=>{const c=FV['abp'+i];if(!c)return null;const b={school_id:me.school_id,class_id:p.r.class_id,date:p.d,lesson_no:p.r.n,teaching_id:p.r.teaching_id,note};
    if(c==='cancel')return{...b,kind:'cancelled'};const id=c.slice(4),sj=p.sj[id];return{...b,kind:'substitution',sub_teacher_id:id,sub_subject_id:sj&&sj!==p.subj?sj:null}}).filter(Boolean);
  if(!rows.length){toast('Zapisano nieobecność');return reload()}
  act(sb.from('timetable_changes').insert(rows),reload,'Zapisano nieobecność i '+rows.length+' zmian w planie')}
const absDel=async id=>await ask('Usunąć zgłoszenie nieobecności? (zmiany w planie usuń osobno w „Zmiany w planie”)','Usuń')&&act(sb.from('teacher_absences').delete().eq('id',id),reload,'Usunięto');


init();
</script>
