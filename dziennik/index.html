<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Dziennik — Minerva</title>
<link rel="icon" type="image/svg+xml" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Open Sans"','sans-serif']},colors:{indigoBrand:'#1E2A78',indigoDark:'#141D56',amberBrand:'#F5A524'}}}}
</script>
<style>
body{font-family:'Open Sans',sans-serif;background:#F8FAFC;color:#1E293B}
.btn{position:relative;overflow:hidden;z-index:1;background:#1E2A78;color:#fff;padding:.55rem 1rem;border-radius:.75rem;font-weight:700;font-size:.875rem;transition:color .35s,transform .25s}
.btn::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:#F5A524;transform:translate(-50%,-50%);transition:width .5s,height .5s;z-index:-1}
.btn:hover::before{width:320%;height:600%}.btn:hover{color:#1E2A78}
.btn-sm{padding:.3rem .65rem;font-size:.75rem}
.btn-ghost{background:#E2E8F0;color:#1E293B}.btn-red{background:#DC2626}.btn-green{background:#15803D}
.inp{width:100%;padding:.55rem .75rem;border-radius:.75rem;border:1px solid #CBD5E1;font-size:.875rem;background:#fff;outline:none}
.inp:focus{border-color:#1E2A78;box-shadow:0 0 0 3px rgba(30,42,120,.15)}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:1rem;padding:1.25rem}
.lbl{display:block;font-size:.75rem;font-weight:700;color:#475569;margin:.6rem 0 .25rem}
.nav{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;padding:.7rem 1rem;border-radius:.75rem;color:rgba(255,255,255,.9);font-weight:600;font-size:.875rem;white-space:nowrap}
.nav:hover{background:#1E2A78}.nav.on{background:#1E2A78;box-shadow:inset 3px 0 0 #F5A524}
.dot{display:none;margin-left:auto;min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:9999px;background:#F5A524;color:#141D56;font-size:.7rem;font-weight:800;align-items:center;justify-content:center}
th{text-align:left;font-size:.75rem;color:#64748B;padding:.5rem}td{padding:.5rem;border-top:1px solid #F1F5F9;vertical-align:middle;font-size:.875rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="min-h-screen flex flex-col antialiased">
<div id="modal"></div><div id="toast" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>

<header class="bg-[#080B1A] sticky top-0 z-40 px-4 sm:px-8 py-3 flex items-center justify-between shadow-md">
  <img src="https://dziennik-minerva.pages.dev/themes/logo-horizontal-white.svg" alt="Minerva" class="h-9 w-auto">
  <div class="flex items-center gap-3">
    <div class="text-right hidden sm:block"><p class="text-sm font-bold text-white" id="uName">…</p><p class="text-xs text-amberBrand font-semibold" id="uRole"></p></div>
    <button onclick="passModal(true)" class="text-xs font-semibold text-white/80 hover:text-amberBrand px-2">Zmień hasło</button>
    <button onclick="logout()" class="px-3 py-2 rounded-xl bg-red-500/20 text-red-200 hover:bg-red-500 hover:text-white text-sm font-semibold">Wyloguj</button>
  </div>
</header>
<div class="flex-1 flex flex-col md:flex-row min-h-0">
  <aside class="md:w-64 bg-[#0D122B] p-3 shrink-0 overflow-x-auto"><nav id="nav" class="flex md:flex-col gap-1"></nav></aside>
  <main id="main" class="flex-1 p-4 sm:p-8 overflow-y-auto"></main>
</div>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://xodfwrgkudllvfdetljw.supabase.co','sb_publishable_FY5C7kLlrQZDQooJ54klMQ_il0jVpsJ');

/* ---------- helpery ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'});
const ROLE={dyrektor:'Dyrektor',nauczyciel:'Nauczyciel',rodzic:'Rodzic / opiekun',uczen:'Uczeń'};
const ST={obecny:'Obecny',nieobecny:'Nieobecny',spozniony:'Spóźniony',usprawiedliwiony:'Usprawiedliwiony'};
const DAYS=['Pon','Wt','Śr','Czw','Pt'];
const card=h=>`<div class="card text-sm text-slate-600">${h}</div>`;
const title=t=>`<h2 class="text-2xl font-extrabold text-indigoBrand mb-4">${t}</h2>`;
const opts=(arr,sel,k='id',l='name')=>arr.map(o=>`<option value="${o[k]}" ${o[k]===sel?'selected':''}>${esc(o[l])}</option>`).join('');
const byName=(a,b)=>a.full_name.localeCompare(b.full_name,'pl');
const toast=(m,bad)=>{const e=document.createElement('div');e.className=`px-4 py-3 rounded-xl text-sm font-semibold shadow-lg text-white ${bad?'bg-red-600':'bg-indigoBrand'}`;e.textContent=m;$('toast').append(e);setTimeout(()=>e.remove(),4000)};
const ok=async p=>{const r=await p;if(r.error){toast(r.error.message,1);throw r.error}return r.data};
const modal=(h,wide)=>{$('modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/50 flex items-start justify-center p-4 overflow-y-auto"><div class="bg-white rounded-2xl p-6 w-full ${wide?'max-w-4xl':'max-w-lg'} mt-8 shadow-2xl">${h}</div></div>`};
window.closeModal=()=>{$('modal').innerHTML=''};

/* ---------- stan ---------- */
let me,lastSeen,view='dashboard',classes=[],subjects=[],dir=[],assign=[],tsubs=[],children=[],child=null;
const dots={messages:0,announcements:0,grades:0,excuses:0},clearedAt={};
const isDir=()=>me.role==='dyrektor',isT=()=>isDir()||me.role==='nauczyciel';
const cls=id=>classes.find(c=>c.id===id)?.name||'—',subj=id=>subjects.find(s=>s.id===id)?.name||'—',who=id=>dir.find(d=>d.id===id)?.full_name||'—';

/* ---------- start ---------- */
const {data:{session}}=await sb.auth.getSession();
if(!session) location.href='/login'; else await init(session.user.id);

async function init(uid){
  me=await ok(sb.from('profiles').select('*').eq('id',uid).single());
  lastSeen=me.last_seen||new Date(0).toISOString();
  await sb.rpc('touch_seen');
  $('uName').textContent=me.full_name;$('uRole').textContent=ROLE[me.role];
  if(me.must_change){passModal(false);return}
  await loadRef();build();render();refreshDots();
  let t;sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(t);t=setTimeout(onLive,400)}).subscribe();
}
async function loadRef(){
  [classes,subjects,dir,assign,tsubs]=await Promise.all([
    ok(sb.from('classes').select('*').order('name')),ok(sb.from('subjects').select('*').order('name')),
    ok(sb.from('directory').select('*')),ok(sb.from('assignments').select('*')),ok(sb.from('teacher_subjects').select('*'))]);
  if(me.role==='rodzic') children=(await ok(sb.from('parent_children').select('child_id').eq('parent_id',me.id))).map(r=>r.child_id);
}
window.logout=async()=>{await sb.auth.signOut();location.href='/login'};

/* ---------- hasło ---------- */
window.passModal=optional=>{
  modal(`<h3 class="text-xl font-extrabold text-indigoBrand">${optional?'Zmień hasło':'Ustaw własne hasło'}</h3>
  ${optional?'':'<p class="text-sm text-slate-600 mt-1">Zalogowano hasłem jednorazowym. Ustaw własne hasło, aby przejść dalej.</p>'}
  <label class="lbl">Nowe hasło (min. 8 znaków)</label><input id="p1" type="password" class="inp" autocomplete="new-password">
  <label class="lbl">Powtórz hasło</label><input id="p2" type="password" class="inp" autocomplete="new-password">
  <div class="flex gap-2 mt-4"><button class="btn" onclick="savePass()">Zapisz hasło</button>${optional?'<button class="btn btn-ghost" onclick="closeModal()">Anuluj</button>':''}</div>`);
};
window.savePass=async()=>{
  const a=$('p1').value;
  if(a.length<8) return toast('Hasło musi mieć co najmniej 8 znaków',1);
  if(a!==$('p2').value) return toast('Hasła nie są takie same',1);
  const {error}=await sb.auth.updateUser({password:a});
  if(error) return toast(error.message,1);
  await sb.rpc('finish_password_change');location.reload();
};

/* ---------- nawigacja i kropki ---------- */
function build(){
  const it=[['dashboard','Pulpit'],['messages','Wiadomości'],['announcements','Ogłoszenia']];
  if(!isT()) it.push(['grades','Oceny i frekwencja']);
  if(isT()) it.push(['panel','Oceny i frekwencja']);
  if(me.role==='rodzic'||isT()) it.push(['excuses','Usprawiedliwienia']);
  it.push(['plan','Plan lekcji']);
  if(isDir()) it.push(['accounts','Konta'],['school','Placówka']);
  $('nav').innerHTML=it.map(([k,t])=>`<button class="nav" data-k="${k}" onclick="go('${k}')">${t}<span class="dot" id="dot-${k}"></span></button>`).join('');
}
window.go=k=>{view=k;if(k==='announcements'||k==='grades')clearedAt[k]=new Date().toISOString();render();refreshDots()};
async function refreshDots(){
  const H={count:'exact',head:true},th=k=>clearedAt[k]||lastSeen,n=async q=>(await q).count||0;
  const kid=me.role==='uczen'||me.role==='rodzic';
  const [m,a,g,r,e]=await Promise.all([
    n(sb.from('message_recipients').select('message_id',H).eq('user_id',me.id).is('read_at',null)),
    n(sb.from('announcements').select('id',H).gt('created_at',th('announcements')).neq('author_id',me.id)),
    kid?n(sb.from('grades').select('id',H).gt('created_at',th('grades'))):0,
    kid?n(sb.from('remarks').select('id',H).gt('created_at',th('grades'))):0,
    isT()?n(sb.from('excuses').select('id',H).eq('status','oczekuje')):
      me.role==='rodzic'?n(sb.from('excuses').select('id',H).neq('status','oczekuje').gt('decided_at',th('excuses'))):0]);
  Object.assign(dots,{messages:m,announcements:a,grades:g+r,excuses:e});
  for(const k in dots){const d=$('dot-'+k);if(d){d.textContent=dots[k];d.style.display=dots[k]?'inline-flex':'none'}}
  const tot=Object.values(dots).reduce((x,y)=>x+y,0);document.title=(tot?`(${tot}) `:'')+'E-Dziennik — Minerva';
  if(view==='dashboard')render();
}
async function onLive(){
  await refreshDots();
  const typing=document.activeElement?.closest?.('#main')&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(['messages','announcements','grades','excuses'].includes(view)&&!typing&&!$('modal').innerHTML) render();
}
async function render(){
  document.querySelectorAll('#nav .nav').forEach(b=>b.classList.toggle('on',b.dataset.k===view));
  const V={dashboard:vDash,messages:vMessages,announcements:vAnn,grades:vGrades,panel:vPanel,excuses:vExcuses,plan:vPlan,accounts:vAccounts,school:vSchool};
  try{$('main').innerHTML=`<div class="max-w-5xl mx-auto">${await V[view]()}</div>`}catch(e){$('main').innerHTML=card('Nie udało się wczytać widoku: '+esc(e.message))}
}

/* ---------- pulpit ---------- */
async function vDash(){
  const tile=(k,l)=>`<button onclick="go('${k}')" class="card text-left hover:border-amberBrand"><p class="text-3xl font-extrabold ${dots[k]?'text-amberBrand':'text-slate-300'}">${dots[k]}</p><p class="text-sm font-semibold text-slate-600 mt-1">${l}</p></button>`;
  return `<div class="rounded-2xl bg-gradient-to-r from-indigoBrand to-indigoDark text-white p-7 mb-5"><h1 class="text-2xl font-extrabold">Witaj, ${esc(me.full_name)}</h1>
  <p class="text-white/70 text-sm mt-1">Poprzednie logowanie: ${me.last_seen?fmt(me.last_seen):'to pierwsze logowanie'}</p></div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${tile('messages','Nieprzeczytane wiadomości')}${tile('announcements','Nowe ogłoszenia')}
  ${!isT()?tile('grades','Nowe oceny i uwagi'):''}${me.role==='rodzic'||isT()?tile('excuses',isT()?'Usprawiedliwienia do rozpatrzenia':'Rozpatrzone usprawiedliwienia'):''}</div>`;
}

/* ---------- wiadomości ---------- */
let tab='in';const mc={};
async function vMessages(){
  const [a,b]=await Promise.all([
    ok(sb.from('message_recipients').select('read_at,messages(id,subject,body,created_at,deleted_at,sender_id)').eq('user_id',me.id)),
    ok(sb.from('messages').select('id,subject,body,created_at,deleted_at,sender_id,message_recipients(user_id)').eq('sender_id',me.id))]);
  const d=(x,y)=>new Date(y.created_at)-new Date(x.created_at);
  const inbox=a.filter(r=>r.messages).map(r=>({...r.messages,unread:!r.read_at,box:'in'})).sort(d);
  const sent=b.map(m=>({...m,box:'out'})).sort(d);
  [...inbox,...sent].forEach(m=>mc[m.id+m.box]=m);
  const list=tab==='in'?inbox:sent;
  const tb=(k,l)=>`<button onclick="tab='${k}';render()" class="px-4 py-2 rounded-xl text-sm font-bold ${tab===k?'bg-indigoBrand text-white':'bg-white border border-slate-200'}">${l}</button>`;
  return `<div class="flex items-center justify-between mb-4">${title('Wiadomości').replace('mb-4','')}<button class="btn" onclick="compose()">Nowa wiadomość</button></div>
  <div class="flex gap-2 mb-3">${tb('in','Odebrane')}${tb('out','Wysłane')}</div>
  <div class="card p-0 divide-y divide-slate-100">${list.map(m=>`<button onclick="openMsg('${m.id}','${m.box}')" class="w-full text-left px-4 py-3 hover:bg-slate-50 flex items-center gap-3">
    <span class="w-2.5 h-2.5 rounded-full ${m.unread?'bg-amberBrand':'bg-transparent'}"></span>
    <span class="flex-1 min-w-0"><span class="block text-sm ${m.unread?'font-extrabold':'font-semibold'} truncate">${m.deleted_at?'<em class="text-slate-400">Wiadomość usunięta przez nadawcę</em>':esc(m.subject)}</span>
    <span class="block text-xs text-slate-500">${m.box==='in'?'Od: '+esc(who(m.sender_id)):'Do: '+m.message_recipients.length+' os.'}</span></span>
    <span class="text-xs text-slate-400">${fmt(m.created_at)}</span></button>`).join('')||'<p class="p-6 text-sm text-slate-500">Brak wiadomości.</p>'}</div>`;
}
window.tab=tab;Object.defineProperty(window,'tab',{get:()=>tab,set:v=>{tab=v}});
window.openMsg=async(id,box)=>{
  const m=mc[id+box];let body;
  if(m.deleted_at){const d=new Date(m.deleted_at);body=`<p class="p-4 rounded-xl bg-slate-100 text-slate-600 text-sm">Ta wiadomość została usunięta przez nadawcę w dniu ${d.toLocaleDateString('pl-PL')} o godzinie ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}.</p>`}
  else body=`<h3 class="text-xl font-extrabold text-indigoBrand">${esc(m.subject)}</h3><p class="text-xs text-slate-500 mb-3">${box==='in'?'Od: '+esc(who(m.sender_id)):'Do: '+esc(m.message_recipients.map(r=>who(r.user_id)).join(', '))} • ${fmt(m.created_at)}</p><div class="whitespace-pre-wrap text-sm">${esc(m.body)}</div>`;
  modal(`${body}<div class="flex gap-2 mt-5"><button class="btn btn-ghost" onclick="closeModal()">Zamknij</button>
  ${box==='out'&&isT()&&!m.deleted_at?`<button class="btn btn-red" onclick="retract('${id}')">Wycofaj wiadomość</button>`:''}</div>`);
  if(box==='in'&&m.unread){await sb.from('message_recipients').update({read_at:new Date().toISOString()}).match({message_id:id,user_id:me.id});refreshDots()}
};
window.retract=async id=>{if(!confirm('Wycofać wiadomość? Odbiorcy zobaczą informację o usunięciu.'))return;await ok(sb.rpc('retract_message',{p_id:id}));closeModal();toast('Wiadomość wycofana');render()};
window.compose=()=>{
  modal(`<h3 class="text-xl font-extrabold text-indigoBrand mb-2">Nowa wiadomość</h3>
  ${isT()?`<label class="lbl">Odbiorcy</label><div class="flex gap-2"><select id="cMode" class="inp" onchange="cList()"><option value="persons">Wybrane osoby</option><option value="nauczyciel">Wszyscy nauczyciele</option><option value="dyrektor">Dyrekcja</option><option value="rodzic">Rodzice</option><option value="uczen">Uczniowie</option><option value="all">Wszyscy</option></select>
  <select id="cClass" class="inp" onchange="cList()"><option value="">Wszystkie klasy</option>${opts(classes)}</select></div>`:'<p class="text-xs text-slate-500">Możesz pisać do nauczycieli i wychowawców.</p>'}
  <div id="cPick"><input id="cFind" class="inp mt-2" placeholder="Szukaj osoby…" oninput="cList()"><div id="cList" class="max-h-44 overflow-auto border border-slate-200 rounded-xl mt-2 p-2"></div></div>
  <label class="lbl">Temat</label><input id="cSub" class="inp"><label class="lbl">Treść</label><textarea id="cBody" rows="6" class="inp"></textarea>
  <div class="flex gap-2 mt-4"><button class="btn" onclick="sendMsg()">Wyślij</button><button class="btn btn-ghost" onclick="closeModal()">Anuluj</button></div>`);
  cList();
};
const cMode=()=>isT()?$('cMode').value:'persons';
window.cList=()=>{
  const mode=cMode();$('cPick').style.display=mode==='persons'?'block':'none';
  const q=($('cFind')?.value||'').toLowerCase(),k=$('cClass')?.value;
  let pool=isT()?dir.filter(d=>d.id!==me.id):dir.filter(d=>['nauczyciel','dyrektor'].includes(d.role));
  if(k)pool=pool.filter(d=>d.class_id===k);
  $('cList').innerHTML=pool.filter(d=>d.full_name.toLowerCase().includes(q)).sort(byName).slice(0,100).map(d=>`<label class="flex items-center gap-2 py-1 text-sm"><input type="checkbox" class="cTo" value="${d.id}"> ${esc(d.full_name)} <span class="text-xs text-slate-400">${ROLE[d.role]}${d.class_id?' • '+esc(cls(d.class_id)):''}${classes.find(c=>c.homeroom_id===d.id)?' • wychowawca '+esc(classes.find(c=>c.homeroom_id===d.id).name):''}</span></label>`).join('')||'<p class="text-xs text-slate-400 p-2">Brak osób.</p>';
};
window.sendMsg=async()=>{
  const mode=cMode(),k=$('cClass')?.value;
  const to=mode==='persons'?[...document.querySelectorAll('.cTo:checked')].map(x=>x.value):dir.filter(d=>d.id!==me.id&&(mode==='all'||d.role===mode)&&(!k||d.class_id===k)).map(d=>d.id);
  if(!to.length)return toast('Wybierz odbiorców',1);
  if(!$('cSub').value.trim()||!$('cBody').value.trim())return toast('Uzupełnij temat i treść',1);
  await ok(sb.rpc('send_message',{p_subject:$('cSub').value.trim(),p_body:$('cBody').value.trim(),p_to:to}));
  closeModal();toast('Wiadomość wysłana');tab='out';render();
};

/* ---------- ogłoszenia ---------- */
async function vAnn(){
  const L=await ok(sb.from('announcements').select('*').order('created_at',{ascending:false}));
  const form=isT()?`<div class="card mb-5"><h3 class="font-extrabold text-indigoBrand">Nowe ogłoszenie</h3>
  <label class="lbl">Tytuł</label><input id="anT" class="inp"><label class="lbl">Treść</label><textarea id="anB" rows="4" class="inp"></textarea>
  <label class="lbl">Dla kogo (nic nie zaznaczone = wszyscy)</label>
  <div class="flex gap-4 text-sm flex-wrap">${['nauczyciel','rodzic','uczen'].map(r=>`<label><input type="checkbox" class="anR" value="${r}"> ${{nauczyciel:'Nauczyciele',rodzic:'Rodzice',uczen:'Uczniowie'}[r]}</label>`).join('')}</div>
  <label class="lbl">Klasy (Ctrl/Cmd — wiele; nic = wszystkie)</label><select id="anC" multiple class="inp h-24">${opts(classes)}</select>
  <button class="btn mt-3" onclick="postAnn()">Opublikuj</button></div>`:'';
  return title('Ogłoszenia')+form+`<div class="space-y-3">${L.map(a=>`<article class="card ${a.created_at>lastSeen&&a.author_id!==me.id?'border-amberBrand':''}">
   <div class="flex justify-between gap-3"><h3 class="font-extrabold">${esc(a.title)}</h3>${a.author_id===me.id||isDir()?`<button class="text-xs text-red-500" onclick="delRow('announcements','${a.id}')">Usuń</button>`:''}</div>
   <p class="text-xs text-slate-500 mb-2">${esc(who(a.author_id))} • ${fmt(a.created_at)} • Dla: ${a.roles.length?a.roles.map(r=>ROLE[r]).join(', '):'wszystkich'}${a.class_ids.length?' • klasy: '+esc(a.class_ids.map(cls).join(', ')):''}</p>
   <p class="text-sm whitespace-pre-wrap">${esc(a.body)}</p></article>`).join('')||card('Brak ogłoszeń.')}</div>`;
}
window.postAnn=async()=>{
  if(!$('anT').value.trim()||!$('anB').value.trim())return toast('Uzupełnij tytuł i treść',1);
  await ok(sb.from('announcements').insert({author_id:me.id,title:$('anT').value.trim(),body:$('anB').value.trim(),roles:[...document.querySelectorAll('.anR:checked')].map(x=>x.value),class_ids:[...$('anC').selectedOptions].map(o=>o.value)}));
  toast('Ogłoszenie opublikowane');render();
};
window.delRow=async(t,id)=>{if(!confirm('Na pewno usunąć?'))return;await ok(sb.from(t).delete().eq('id',id));closeModal();render()};

/* ---------- oceny: uczeń / rodzic ---------- */
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n+(/\+$/.test(v)?.5:/-$/.test(v)?-.25:0)};
const canEdit=r=>isDir()||r.teacher_id===me.id;
const chip=g=>`<span title="${esc(subj(g.subject_id)+' • waga '+g.weight+(g.category?' • '+g.category:'')+' • '+who(g.teacher_id)+' • '+fmt(g.created_at))}" class="inline-flex items-center gap-1 px-2 py-0.5 mr-1 rounded-lg bg-indigo-50 text-indigoBrand font-bold text-sm ${g.created_at>lastSeen?'ring-2 ring-amberBrand':''}">${esc(g.value)}<small class="text-slate-400">${g.weight>1?'×'+g.weight:''}</small>${canEdit(g)?`<button class="text-red-400 text-xs" onclick="delRow('grades','${g.id}')">×</button>`:''}</span>`;
async function studentCard(sid){
  const [g,r,a]=await Promise.all([ok(sb.from('grades').select('*').eq('student_id',sid).order('created_at')),
    ok(sb.from('remarks').select('*').eq('student_id',sid).order('created_at',{ascending:false})),
    ok(sb.from('attendance').select('*').eq('student_id',sid).order('date',{ascending:false}).limit(80))]);
  const bySub={};g.forEach(x=>(bySub[x.subject_id]??=[]).push(x));
  const avg=l=>{let s=0,w=0;l.forEach(x=>{const n=num(x.value);if(n!==null){s+=n*x.weight;w+=x.weight}});return w?(s/w).toFixed(2):'—'};
  const cnt=s=>a.filter(x=>x.status===s).length;
  return `<div class="space-y-4"><div class="card"><h3 class="font-extrabold text-indigoBrand mb-2">Oceny — ${esc(who(sid))} (${esc(cls(dir.find(d=>d.id===sid)?.class_id))})</h3>
  <table class="w-full"><tr><th>Przedmiot</th><th>Oceny</th><th>Średnia</th></tr>${Object.entries(bySub).map(([s,l])=>`<tr><td class="font-semibold">${esc(subj(s))}</td><td>${l.map(chip).join('')}</td><td class="font-bold">${avg(l)}</td></tr>`).join('')||'<tr><td colspan=3 class="text-slate-500">Brak ocen.</td></tr>'}</table></div>
  <div class="card"><h3 class="font-extrabold text-indigoBrand mb-2">Uwagi i pochwały</h3>${r.map(x=>`<div class="py-2 border-t border-slate-100 text-sm ${x.created_at>lastSeen?'bg-amber-50':''}"><b class="${x.kind==='uwaga'?'text-red-600':'text-green-700'}">${x.kind==='uwaga'?'Uwaga':'Pochwała'}</b> — ${esc(x.body)} <span class="text-xs text-slate-400">${esc(who(x.teacher_id))}, ${fmt(x.created_at)}</span>${canEdit(x)?` <button class="text-xs text-red-400" onclick="delRow('remarks','${x.id}')">usuń</button>`:''}</div>`).join('')||'<p class="text-sm text-slate-500">Brak wpisów.</p>'}</div>
  <div class="card"><h3 class="font-extrabold text-indigoBrand mb-2">Frekwencja</h3><p class="text-sm mb-2">Nieobecności: <b>${cnt('nieobecny')}</b> • Spóźnienia: <b>${cnt('spozniony')}</b> • Usprawiedliwione: <b>${cnt('usprawiedliwiony')}</b></p>
  ${a.filter(x=>x.status!=='obecny').map(x=>`<div class="text-sm py-1 border-t border-slate-100">${new Date(x.date).toLocaleDateString('pl-PL')}, lekcja ${x.hour} — ${esc(subj(x.subject_id))}: <b>${ST[x.status]}</b></div>`).join('')}</div></div>`;
}

/* ---------- dyrektor: konta ---------- */
const A={t:'uczen'};
const PRE={uczen:'u',rodzic:'r',nauczyciel:'n',dyrektor:'d'};
const mkPass=()=>{const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint32Array(10));return [...r].map(x=>a[x%a.length]).join('')};
const mkLogin=(role,name)=>{const p=name.toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').trim().split(/\s+/);
  return `${PRE[role]}.${(p[0]||'x')[0]}${p[p.length-1]||''}${Math.floor(100+Math.random()*900)}`};
async function mk(role,name,extra){
  for(let i=0;i<4;i++){
    const login=mkLogin(role,name),pass=mkPass();
    const {data,error}=await sb.rpc('create_account',{p_login:login,p_password:pass,p_name:name,p_role:role,...extra});
    if(!error)return {id:data,login,pass,name,role};
    if(!/duplicate|unique/i.test(error.message))throw error;
  }
  throw new Error('Nie udało się wygenerować unikalnego loginu');
}

window.submitAcct=async()=>{
  const w=window.open('','_blank'),v=id=>$(id)?.value.trim();
  try{
    const name=v('aName');if(!name)throw new Error('Podaj imię i nazwisko');
    const out=[];
    if(A.t==='uczen'){
      const s=await mk('uczen',name,{p_class:v('aClass')||null,p_birth:v('aBirth')||null,p_mother:v('aMother')||null,p_father:v('aFather')||null,p_guardian:v('aGuard')||null});out.push(s);
      for(const k of ['aMother','aFather','aGuard'])if(v(k))out.push(await mk('rodzic',v(k),{p_child:s.id}));

      const subs=[...document.querySelectorAll('.aSub:checked')].map(x=>x.value);
      if(subs.length)await ok(sb.from('teacher_subjects').insert(subs.map(s=>({teacher_id:t.id,subject_id:s}))));
      if(v('aHome'))await ok(sb.from('classes').update({homeroom_id:t.id}).eq('id',v('aHome')));
    }
    printPage(w,out);toast('Konta utworzone — wydruk otwarty w nowej karcie');await loadRef();render();
  }catch(e){w?.close();toast(e.message,1)}
};

   <label class="lbl">Klasa wychowawcza (opcjonalnie)</label><select id="aHome" class="inp"><option value="">— brak —</option>${opts(classes)}</select>`;
  return title('Konta')+`<div class="card mb-5"><h3 class="font-extrabold text-indigoBrand">Nowe konto</h3>
  <label class="lbl">Rodzaj konta</label><select class="inp" onchange="acctType(this.value)"><option value="uczen" ${A.t==='uczen'?'selected':''}>Uczeń (+ konta rodziców)</option><option value="nauczyciel" ${A.t==='nauczyciel'?'selected':''}>Nauczyciel</option><option value="dyrektor" ${A.t==='dyrektor'?'selected':''}>Dyrektor</option></select>
  <label class="lbl">Imię i nazwisko</label><input id="aName" class="inp">${f}<button class="btn mt-4" onclick="submitAcct()">Utwórz konto i otwórz wydruk</button></div>
  <div class="card"><div class="flex justify-between gap-2 mb-2"><h3 class="font-extrabold text-indigoBrand">Wszystkie konta (${pr.length})</h3><input class="inp max-w-xs" placeholder="Szukaj…" oninput="const q=this.value.toLowerCase();document.querySelectorAll('#acc tr[data-s]').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')"></div>
  <div class="overflow-x-auto"><table class="w-full" id="acc"><tr><th>Imię i nazwisko</th><th>Rodzaj</th><th>Login</th><th>Klasa / uwagi</th><th></th></tr>${pr.map(p=>{
    const kid=pc.find(x=>x.parent_id===p.id),sj=tsubs.filter(t=>t.teacher_id===p.id).map(t=>subj(t.subject_id)).join(', '),hr=classes.find(c=>c.homeroom_id===p.id);
    return `<tr data-s="${esc((p.full_name+p.login+p.role).toLowerCase())}"><td class="font-semibold">${esc(p.full_name)}</td><td>${ROLE[p.role]}${p.must_change?' <span class="text-xs text-amber-600">(hasło jednorazowe)</span>':''}</td><td><code>${esc(p.login)}</code></td>
    <td>${p.role==='uczen'?`<select class="inp !w-28" onchange="setClass('${p.id}',this.value)"><option value="">—</option>${opts(classes,p.class_id)}</select>`:p.role==='rodzic'?'dziecko: '+esc(kid?who(kid.child_id):'—'):esc(sj)+(hr?' • wychowawca '+esc(hr.name):'')}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="resetPw('${p.id}')">Resetuj hasło</button></td></tr>`}).join('')}</table></div></div>`;
}
window.setClass=async(id,c)=>{await ok(sb.from('profiles').update({class_id:c||null}).eq('id',id));await loadRef();toast('Zmieniono klasę')};
window.resetPw=async id=>{
  if(!confirm('Zresetować hasło? Użytkownik dostanie nowe hasło jednorazowe.'))return;
  const w=window.open('','_blank');
  try{const p=await ok(sb.from('profiles').select('*').eq('id',id).single()),pass=mkPass();
    await ok(sb.rpc('reset_password',{p_user:id,p_password:pass}));printPage(w,[{name:p.full_name,role:p.role,login:p.login,pass}]);toast('Hasło zresetowane');render();
  }catch(e){w?.close()}
};

/* ---------- dyrektor: placówka ---------- */
async function vSchool(){
  const T=dir.filter(d=>['nauczyciel','dyrektor'].includes(d.role)).sort(byName);
  return title('Placówka i plany')+`<div class="grid md:grid-cols-2 gap-5">
  <div class="card"><h3 class="font-extrabold text-indigoBrand mb-2">Przedmioty</h3><div class="flex gap-2"><input id="nS" class="inp" placeholder="Nazwa przedmiotu"><button class="btn" onclick="addSub()">Dodaj</button></div>
   <div class="mt-3 space-y-1">${subjects.map(s=>`<div class="flex justify-between text-sm py-1 border-t border-slate-100">${esc(s.name)}<button class="text-red-400 text-xs" onclick="delKey('subjects','${s.id}')">usuń</button></div>`).join('')||'<p class="text-sm text-slate-500">Brak przedmiotów.</p>'}</div></div>
  <div class="card"><h3 class="font-extrabold text-indigoBrand mb-2">Klasy i wychowawcy</h3><div class="flex gap-2"><input id="nC" class="inp" placeholder="np. 4a"><button class="btn" onclick="addClass()">Dodaj</button></div>
   <div class="mt-3 space-y-1">${classes.map(c=>`<div class="flex items-center gap-2 text-sm py-1 border-t border-slate-100"><b class="w-12">${esc(c.name)}</b><select class="inp" onchange="setHome('${c.id}',this.value)"><option value="">— bez wychowawcy —</option>${T.map(t=>`<option value="${t.id}" ${t.id===c.homeroom_id?'selected':''}>${esc(t.full_name)}</option>`).join('')}</select><button class="text-red-400 text-xs" onclick="delKey('classes','${c.id}')">usuń</button></div>`).join('')||'<p class="text-sm text-slate-500">Brak klas.</p>'}</div></div>
  <div class="card md:col-span-2"><h3 class="font-extrabold text-indigoBrand mb-2">Kto uczy którą klasę</h3>
   <div class="grid sm:grid-cols-4 gap-2"><select id="asT" class="inp">${T.map(t=>`<option value="${t.id}">${esc(t.full_name)}</option>`).join('')}</select><select id="asC" class="inp">${opts(classes)}</select><select id="asS" class="inp">${opts(subjects)}</select><button class="btn" onclick="addAssign()">Przypisz</button></div>
   <div class="mt-3">${assign.map(a=>`<div class="flex justify-between text-sm py-1 border-t border-slate-100"><span>${esc(who(a.teacher_id))} — ${esc(cls(a.class_id))} — ${esc(subj(a.subject_id))}</span><button class="text-red-400 text-xs" onclick="delAssign('${a.teacher_id}','${a.class_id}','${a.subject_id}')">usuń</button></div>`).join('')}</div>
   <p class="text-xs text-slate-500 mt-3">Uczniów do klas przypisujesz w zakładce Konta, a plan lekcji ustawiasz w zakładce Plan lekcji.</p></div></div>`;
}
const refresh=async()=>{await loadRef();render()};
window.addSub=async()=>{if(!$('nS').value.trim())return;await ok(sb.from('subjects').insert({name:$('nS').value.trim()}));refresh()};
window.addClass=async()=>{if(!$('nC').value.trim())return;await ok(sb.from('classes').insert({name:$('nC').value.trim()}));refresh()};
window.setHome=async(id,t)=>{await ok(sb.from('classes').update({homeroom_id:t||null}).eq('id',id));refresh()};
window.delKey=async(t,id)=>{if(!confirm('Usunąć? Powiązane dane (oceny, plan) mogą zostać usunięte.'))return;await ok(sb.from(t).delete().eq('id',id));refresh()};
window.addAssign=async()=>{await ok(sb.from('assignments').insert({teacher_id:$('asT').value,class_id:$('asC').value,subject_id:$('asS').value}));refresh()};
window.delAssign=async(t,c,s)=>{await ok(sb.from('assignments').delete().match({teacher_id:t,class_id:c,subject_id:s}));refresh()};
</script>
</body>
