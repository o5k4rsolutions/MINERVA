async function setCell(d,n,tid){const e=TT.find(x=>x.weekday===d&&x.lesson_no===n);if(tid===undefined||(tid===''&&!e)){closeModal();return}

async function saveChg(){const k=FV.ck,cid=FV.cc2,d=FV.cd,n=+FV.cn2,okd=q=>{const x=new Date(q+'T12:00');return x.getDay()%6!==0&&!hol(x)};
  if(!cid||!d)return warn('Wybierz klasę i datę.');if(!okd(d))return warn('Ten dzień jest wolny od zajęć.');
  if(k==='substitution'&&!FV.ct2)return warn('Wybierz nauczyciela zastępującego.');
  if(k==='moved'&&(!FV.md||!okd(FV.md)))return warn('Wybierz dzień roboczy (nie wolny), na który przenosisz lekcję.');
  const wd=(new Date(d+'T12:00').getDay()+6)%7+1,{data:tt,error}=await sb.from('timetable').select('*').eq('class_id',cid).eq('weekday',wd).eq('lesson_no',n);if(error)return warn(error.message);
  const e=tt[0];if(!e)return warn('W planie tej klasy nie ma lekcji w tym terminie.');
  if(CH.some(x=>x.class_id===cid&&x.date===d&&x.lesson_no===n&&x.kind!=='moved_in'))return warn('Ta lekcja ma już zmianę. Usuń ją najpierw.');
  const b={school_id:me.school_id,class_id:cid,date:d,lesson_no:n,teaching_id:e.teaching_id,note:v('cnt2').trim()||null};let rows;
  if(k==='substitution')rows=[{...b,kind:'substitution',sub_teacher_id:FV.ct2,sub_subject_id:FV.cs2||null}];
  else if(k==='cancelled')rows=[{...b,kind:'cancelled'}];
  else{const g=crypto.randomUUID();rows=[{...b,kind:'moved_out',grp:g},{...b,kind:'moved_in',date:FV.md,lesson_no:+FV.mn2,grp:g}]}
  act(sb.from('timetable_changes').insert(rows),reload,'Zapisano zmianę')}

  +pn('Wycieczki (od 30 dni wstecz)',data.length?tbl(['Klasa','Cel','Termin','Lekcje','Odwołane lekcje',''],data.map(t=>`<tr><td>${esc(cn(t.class_id))}</td><td><b>${esc(t.title)}</b>${t.note?`<div class="text-xs mu">${esc(t.note)}</div>`:''}</td><td>${fdl(t.date_from)}${t.date_to!==t.date_from?' - '+fdl(t.date_to):''}</td><td>${t.lesson_from}-${t.lesson_to}</td><td>${CH.filter(k=>k.trip_id===t.id).length}</td><td>${mineC(t.class_id)?`<button class="gh sm red" onclick="delTrip('${t.id}')">${ic('trash')}</button>`:''}</td></tr>`)):'<p class="em">Brak wycieczek.</p>','','tr')};
function saveTrip(){const f=FV.trf,d=FV.trd||f;if(!FV.trc||!f||!v('trt').trim())return warn('Wybierz klasę, datę i wpisz cel wycieczki.');if(d<f)return warn('Data końcowa jest przed początkową.');if(+FV.trl2<+FV.trl1)return warn('Zakres lekcji jest błędny.');
  act(sb.rpc('create_trip',{p_class:FV.trc,p_title:v('trt').trim(),p_from:f,p_to:d,p_l1:+FV.trl1,p_l2:+FV.trl2,p_note:v('trn').trim()||null}),reload,'Dodano wycieczkę, lekcje odwołane')}
const delTrip=async id=>await ask('Usunąć wycieczkę? Odwołane z jej powodu lekcje zostaną przywrócone w planie.','Usuń')&&act(sb.rpc('delete_trip',{p_id:id}),reload,'Wycieczka usunięta');

init();
</script>
