<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dziennik — Minerva</title>
<link rel="icon" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
body{font-family:'Open Sans',sans-serif;background:#F8FAFC;color:#1E293B}
.card{background:#fff;border-radius:1rem;padding:1rem;box-shadow:0 1px 3px #0001;margin-bottom:1rem}
input,select,textarea{border:1px solid #cbd5e1;border-radius:.5rem;padding:.4rem .6rem;width:100%;background:#fff}
.b{background:#1E2A78;color:#fff;border-radius:.5rem;padding:.4rem .9rem;font-weight:600;transition:.2s}.b:hover{background:#F5A524;color:#1E2A78}
.b2{background:#fef3c7;color:#1E2A78;border-radius:.5rem;padding:.2rem .6rem;font-size:.8rem;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:9px;background:#ef4444;margin-left:5px;vertical-align:middle}
th,td{padding:.35rem .5rem;text-align:left;border-bottom:1px solid #e2e8f0;font-size:.9rem}
.tab{padding:.5rem .9rem;border-radius:.6rem;font-weight:600;white-space:nowrap}.tab.on{background:#F5A524;color:#1E2A78}
h2{font-weight:800;color:#1E2A78;margin-bottom:.5rem}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pu{0%{box-shadow:0 0 0 0 #ef444499}100%{box-shadow:0 0 0 8px #ef444400}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.view>.card{animation:fu .45s both}.view>.card:nth-child(2){animation-delay:.07s}.view>.card:nth-child(3){animation-delay:.14s}.view>.card:nth-child(n+4){animation-delay:.2s}
.silent>.card,.silent .stat{animation:none!important}
.card{transition:box-shadow .25s,transform .25s}.card:hover{box-shadow:0 6px 20px #1e2a7820}
tr{transition:background .2s}tr.hv:hover{background:#fffbeb}
.dot{animation:pu 1.6s infinite}
.skel{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 37%,#e2e8f0 63%);background-size:200% 100%;animation:sh 1.3s infinite}
.b{position:relative}.b:active{transform:scale(.96)}.b.busy{pointer-events:none;opacity:.7;padding-right:2rem}.b.busy::after{content:'';position:absolute;right:9px;top:50%;margin-top:-7px;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite}
.tab{transition:.2s}.tab:hover{background:#ffffff1a}.tab.on:hover{background:#F5A524}
#toasts{position:fixed;right:12px;bottom:12px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{padding:.7rem 1rem;border-radius:.7rem;color:#fff;background:#1E2A78;box-shadow:0 8px 24px #0004;animation:fu .3s both;transition:.3s;font-size:.9rem}.toast.ok{background:#15803d}.toast.bad{background:#b91c1c}.toast.out{opacity:0;transform:translateX(30px)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}#modal.show{display:flex}#modal .box{background:#fff;border-radius:1rem;padding:1.3rem;max-width:380px;width:100%;animation:pop .2s both}
.spin{display:inline-block}.spin.go{animation:sp .8s linear infinite}
.msg-row{cursor:pointer}.av{display:inline-flex;width:32px;height:32px;border-radius:50%;background:#1E2A78;color:#fff;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.pill{border-radius:999px;padding:.3rem .9rem;font-weight:600;font-size:.85rem;transition:.2s}.pill.on{background:#1E2A78;color:#fff}
.stat{cursor:pointer;text-align:center}.stat:hover{transform:translateY(-3px)}.stat b{font-size:2rem;color:#1E2A78;display:block}
</style>
</head>
<body>
<header class="bg-[#080B1A] text-white">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 min-w-0"><img src="https://dziennik-minerva.pages.dev/themes/icon-dark.svg" class="h-8" alt="">
      <div class="leading-tight min-w-0"><div id="sch" class="font-bold truncate"></div><div id="who" class="text-xs text-white/60 truncate"></div></div></div>
    <div class="flex items-center gap-2"><span id="live" class="text-xs text-white/60 hidden sm:inline"></span><span id="rfi" class="spin text-white/50 text-sm" title="Dane odświeżają się automatycznie">⟳</span><button class="b2" onclick="logout()">Wyloguj</button></div>
  </div>
  <nav id="nav" class="max-w-6xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto text-white"></nav>
</header>
<main id="main" class="max-w-6xl mx-auto p-4"></main>
<div id="toasts"></div><div id="modal"></div>

<script>
const sb=supabase.createClient('https://YOUR-PROJECT.supabase.co','YOUR-ANON-KEY');
const $=s=>document.querySelector(s), v=id=>$('#'+id).value;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>new Date(d).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'});
const RL={director:'Dyrektor',teacher:'Nauczyciel',parent:'Rodzic/opiekun',student:'Uczeń'};
const AS={present:'obecny',absent:'nieobecny',late:'spóźniony',excused:'usprawiedliwiony'};
const DAYS=['','Pon','Wt','Śr','Czw','Pt'];
let me,school,P={},C=[],SUB=[],T=[],ST={},PC=[],KIDS=[],tab='home',sid=null,dots={},curT=null,curC=null,rid=0,detail=null,mtab='in',pre={};
const nm=id=>P[id]?P[id].first_name+' '+P[id].last_name:'—';
const cn=id=>C.find(c=>c.id===id)?.name||'—', sn=id=>SUB.find(s=>s.id===id)?.name||'—';
const tl=t=>cn(t.class_id)+' — '+sn(t.subject_id);
const staff=()=>me.role==='teacher'||me.role==='director', dir=()=>me.role==='director';
const isHome=()=>C.some(c=>c.homeroom_teacher_id===me.id);
const myT=()=>dir()?T:T.filter(t=>t.teacher_id===me.id);
const opts=(a,f,sel)=>a.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(f(x))}</option>`).join('');
const inClass=(pid,cid)=>P[pid]?.role==='student'?ST[pid]?.class_id===cid:PC.some(r=>r.parent_id===pid&&ST[r.student_id]?.class_id===cid);
const classStudents=cid=>Object.values(P).filter(p=>p.role==='student'&&ST[p.id]?.class_id===cid).sort((a,b)=>a.last_name.localeCompare(b.last_name));
const tbl=(h,rows)=>`<div class="overflow-x-auto"><table class="w-full"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
const toast=(m,t='ok',ms=3500)=>{const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),300)},ms)};
const warn=m=>toast(m,'bad',4500);
const ask=(msg,okL='Tak')=>new Promise(r=>{const m=$('#modal');m.innerHTML=`<div class="box"><p class="font-semibold">${esc(msg)}</p><div class="flex gap-2 justify-end mt-4"><button class="b2" id="mn">Anuluj</button><button class="b" id="my">${okL}</button></div></div>`;m.classList.add('show');const c=x=>{m.classList.remove('show');r(x)};$('#mn').onclick=()=>c(false);$('#my').onclick=()=>c(true)});
const act=async(p,ok,msg)=>{const r=await p;if(r.error){warn(r.error.message||String(r.error));return false}msg&&toast(msg);ok&&await ok();return true};
document.addEventListener('click',e=>{const b=e.target.closest('button.b');if(b){b.classList.add('busy');setTimeout(()=>b.classList.remove('busy'),800)}});
const typing=()=>document.activeElement.matches('input,textarea,select')||(tab==='msg'&&mtab==='new')||[...document.querySelectorAll('#main textarea')].some(t=>t.value);
const beep=()=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch{}};
const gv=x=>{const m=String(x).match(/^([1-6])([+-])?$/);return m?+m[1]+(m[2]==='+'?.5:m[2]==='-'?-.25:0):null};
const avg=g=>{let a=0,w=0;g.forEach(x=>{const n=gv(x.value);if(n!==null){a+=n*x.weight;w+=x.weight}});return w?(a/w).toFixed(2):'—'};
function countUp(){document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/600);e.textContent=Math.round(n*k);if(k<1)requestAnimationFrame(f)})(t0)})}
const LIVE={
 message_recipients:async p=>{if(p.eventType!=='INSERT'||p.new.recipient_id!==me.id)return;const {data:m}=await sb.from('messages').select('subject,sender_id').eq('id',p.new.message_id).single();if(m){toast('✉ '+nm(m.sender_id)+': '+m.subject,'info',6000);beep()}},
 announcements:p=>{if(p.eventType==='INSERT'&&p.new.author_id!==me.id){toast('📢 Nowe ogłoszenie: '+p.new.title,'info',6000);beep()}},
 grades:p=>{if(p.eventType==='INSERT'&&p.new.author_id!==me.id){toast('⭐ Nowa ocena: '+p.new.value,'info',5000);beep()}},
 notes:p=>{if(p.eventType==='INSERT'&&p.new.author_id!==me.id)toast((p.new.kind==='praise'?'👍 Nowa pochwała':'⚠ Nowa uwaga'),'info',5000)},
 justifications:p=>{if(p.eventType==='INSERT'&&staff())toast('🗂 Nowe usprawiedliwienie do rozpatrzenia','info',6000);if(p.eventType==='UPDATE'&&me.role==='parent')toast('Usprawiedliwienie: '+({accepted:'przyjęte',rejected:'odrzucone'}[p.new.status]||''),'info',5000)},
 messages:()=>{},attendance:()=>{}};

const fatal=(t,m)=>{$('#main').innerHTML=`<div class="card"><h2>${esc(t)}</h2><p class="text-sm">${esc(m)}</p><button class="b mt-3" onclick="logout()">Wyloguj i wróć do logowania</button></div>`};
async function init(){
  const {data:{session}}=await sb.auth.getSession(); if(!session)return location.href='/login';
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.href='/login'});
  const {data:m,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error)return fatal('Błąd odczytu konta',error.message+' — sprawdź, czy w Supabase wykonano schema.sql (polityki RLS).');
  if(!m)return fatal('Brak profilu użytkownika','Konto logowania istnieje, ale nie ma dla niego wpisu w tabeli profiles. Poproś dyrekcję o ponowne założenie konta.');
  if(m.must_change_password)return location.href='/login';
  me=m;
  try{await load()}catch(e){return fatal('Błąd wczytywania danych',e.message)}
  $('#sch').textContent=school; $('#who').textContent=`${nm(me.id)} · ${RL[me.role]}`;
  if(me.role==='student')sid=me.id; if(me.role==='parent')sid=KIDS[0]||null;
  await calcDots(); nav(); render();
  let to; const ch=sb.channel('live');
  Object.keys(LIVE).forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{LIVE[t](p);clearTimeout(to);to=setTimeout(async()=>{await calcDots();nav();if(detail){if(t==='messages')openMsg(detail,true);return}if(!typing())render(true)},500)}));
  ch.subscribe(st=>{const e=$('#live');e.classList.remove('hidden');e.innerHTML=st==='SUBSCRIBED'?'<span style="color:#4ade80">●</span> na żywo':'<span style="color:#f87171">●</span> offline'});
  setInterval(()=>{if(!document.hidden&&!detail&&!typing())refresh(true)},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!detail&&!typing())refresh(true)});
  window.addEventListener('online',()=>refresh(true));
}
async function load(){
  const [p,c,s,t,st,pc,sc]=await Promise.all([sb.from('profiles').select('*'),sb.from('classes').select('*').order('name'),sb.from('subjects').select('*').order('name'),sb.from('teaching').select('*'),sb.from('students').select('*'),sb.from('parent_children').select('*'),sb.from('schools').select('name').single()]);
  P={};p.data.forEach(x=>P[x.id]=x);C=c.data;SUB=s.data;T=t.data;ST={};st.data.forEach(x=>ST[x.profile_id]=x);PC=pc.data;school=sc.data?.name||'';
  KIDS=PC.filter(r=>r.parent_id===me.id).map(r=>r.student_id);
}
async function calcDots(){
  const since=me.prev_seen,h=(t)=>sb.from(t).select('*',{count:'exact',head:true});
  const [m,a,g,n,j]=await Promise.all([h('message_recipients').eq('recipient_id',me.id).is('read_at',null),h('announcements').gt('created_at',since).neq('author_id',me.id),h('grades').gt('created_at',since).neq('author_id',me.id),h('notes').gt('created_at',since).neq('author_id',me.id),h('justifications').eq('status','pending')]);
  const keep=k=>dots[k]===0?0:undefined; // otwarta zakładka gasi kropkę do końca sesji
  dots={msg:m.count,ann:keep('ann')??a.count,gr:keep('gr')??g.count,nt:keep('nt')??n.count,js:staff()?(j.count):0};
}
function nav(){const tot=Object.values(dots).reduce((a,b)=>a+(b||0),0);document.title=(tot?`(${tot}) `:'')+'Dziennik — Minerva';
  const t=[['home','Start'],['msg','Wiadomości'],['ann','Ogłoszenia'],['gr','Oceny'],['nt','Uwagi'],['at','Frekwencja'],['pl','Plan']];
  if(me.role==='parent'||(staff()&&(dir()||isHome())))t.push(['js','Usprawiedliwienia']);
  if(staff()&&(dir()||isHome()))t.push(['cl','Klasa']); if(dir())t.push(['ad','Administracja']);
  $('#nav').innerHTML=t.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" onclick="go('${k}')">${l}${dots[k]?'<span class="dot"></span>':''}</button>`).join('');
}
function go(k){tab=k;detail=null;if(['ann','gr','nt'].includes(k))dots[k]=0;nav();render()}
async function render(silent){
  const my=++rid;detail=null;
  if(silent!==true)$('#main').innerHTML='<div class="view">'+[1,2,3].map(()=>'<div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>').join('')+'</div>';
  try{
    let kids='';
    if(me.role==='parent'&&KIDS.length>1&&['gr','nt','at','pl'].includes(tab))kids=`<div class="card"><select onchange="sid=this.value;render()">${opts(KIDS.map(i=>P[i]),nm,sid)}</select></div>`;
    const h=await V[tab](); if(my!==rid)return;
    $('#main').innerHTML=`<div class="view${silent===true?' silent':''}">${kids+h}</div>`;countUp();
  }catch(e){if(my===rid)$('#main').innerHTML=`<div class="card">Nie udało się wczytać danych.<button class="b ml-3" onclick="render()">Spróbuj ponownie</button><p class="text-xs text-slate-500 mt-2">${esc(e.message||e)}</p></div>`}
}
async function refresh(quiet){
  const i=$('#rfi');i&&i.classList.add('go');
  try{await load();await calcDots();nav();if(detail)await openMsg(detail,true);else await render(true);if(quiet!==true)toast('Dane odświeżone','ok',1800)}catch(e){toast('Błąd odświeżania','bad')}
  i&&i.classList.remove('go');
}
async function logout(){await sb.auth.signOut();location.href='/login'}

/* ---------- widoki ---------- */
const V={};
V.home=async()=>{
  const pup=me.role==='student'||me.role==='parent',ids=me.role==='student'?[me.id]:KIDS;
  const [a,g]=await Promise.all([sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(3),pup&&ids.length?sb.from('grades').select('*').in('student_id',ids).order('created_at',{ascending:false}).limit(5):Promise.resolve({data:[]})]);
  const tiles=[['msg','✉','Nieprzeczytane wiadomości'],['ann','📢','Nowe ogłoszenia'],['gr','⭐','Nowe oceny'],['nt','📝','Nowe uwagi'],...(staff()?[['js','🗂','Do rozpatrzenia']]:[])];
  return `<div class="card"><h2>Dzień dobry, ${esc(me.first_name)}!</h2><p class="text-sm text-slate-500">${esc(school)} · poprzednie logowanie: ${fd(me.prev_seen)}</p></div>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">${tiles.map(([k,i,l],n)=>`<div class="card stat" style="animation:fu .45s ${.1+n*.07}s both;margin:0" onclick="go('${k}')"><div class="text-2xl">${i}</div><b data-n="${dots[k]||0}">0</b><small class="text-slate-500">${l}</small></div>`).join('')}</div>
  <div class="card"><h2>Ostatnie ogłoszenia</h2>${(a.data||[]).map(x=>`<div class="py-2 border-b last:border-0"><b>${esc(x.title)}</b> <span class="text-xs text-slate-500">${esc(nm(x.author_id))} · ${fd(x.created_at)}</span><p class="text-sm">${esc(x.body.slice(0,160))}${x.body.length>160?'…':''}</p></div>`).join('')||'<p class="text-slate-500">Brak ogłoszeń.</p>'}</div>`
  +(pup?`<div class="card"><h2>Ostatnie oceny</h2>${(g.data||[]).map(x=>`<div class="py-1 text-sm">${me.role==='parent'?esc(nm(x.student_id))+' · ':''}${esc(sn(T.find(t=>t.id===x.teaching_id)?.subject_id))}: <b class="bg-amber-100 rounded px-2">${esc(x.value)}</b> <span class="text-xs text-slate-500">${fd(x.created_at)}</span></div>`).join('')||'<p class="text-slate-500">Brak ocen.</p>'}</div>`:'');
};

// Wiadomości
V.msg=async()=>{
  const [i,s]=await Promise.all([sb.from('message_recipients').select('read_at,messages(*)').eq('recipient_id',me.id),sb.from('messages').select('*').eq('sender_id',me.id).order('created_at',{ascending:false}).limit(100)]);
  if(i.error)throw i.error; if(s.error)throw s.error;
  const inbox=i.data.filter(r=>r.messages).map(r=>({...r.messages,unread:!r.read_at})).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const rc=s.data.length?(await sb.from('message_recipients').select('message_id,recipient_id').in('message_id',s.data.map(m=>m.id))).data||[]:[];
  const unread=inbox.filter(m=>m.unread).length;
  const row=(m,out)=>{let who=nm(m.sender_id);if(out){const r=rc.filter(x=>x.message_id===m.id).map(x=>nm(x.recipient_id));who='do: '+(r.slice(0,2).join(', ')||'—')+(r.length>2?` +${r.length-2}`:'')}
    const ini=(out?who.slice(4):who)[0]||'?';
    return `<tr class="msg-row hv" onclick="openMsg('${m.id}')"><td style="width:48px"><span class="av">${esc(ini)}</span></td><td><div class="${m.unread?'font-bold':''}">${m.unread?'<span class="dot" style="margin:0 6px 0 0"></span>':''}${m.recalled_at?'<i class="text-slate-400">(wycofana)</i> ':''}${esc(m.subject)}</div><div class="text-xs text-slate-500">${esc(who)}</div></td><td class="text-xs text-slate-500">${fd(m.created_at)}</td></tr>`};
  const list=(a,out)=>a.length?`<div class="overflow-x-auto"><table class="w-full">${a.map(m=>row(m,out)).join('')}</table></div>`:'<p class="text-slate-500 p-4 text-center">Brak wiadomości.</p>';
  return `<div class="card"><div class="flex flex-wrap gap-2 items-center">
    ${[['in','Odebrane'+(unread?` (${unread})`:'')],['out','Wysłane'],['new','✎ Napisz']].map(([k,l])=>`<button class="pill ${mtab===k?'on':'bg-slate-100'}" onclick="mtab='${k}';render(true)">${l}</button>`).join('')}
    ${mtab!=='new'?`<input placeholder="Szukaj…" style="max-width:220px;margin-left:auto" oninput="const q=this.value.toLowerCase();document.querySelectorAll('.msg-row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')">`:''}
    ${mtab==='in'&&unread?`<button class="b2" onclick="markAll()">Oznacz wszystkie jako przeczytane</button>`:''}</div></div>`
   +(mtab==='new'?compose():`<div class="card">${mtab==='in'?list(inbox):list(s.data,1)}</div>`);
};
function compose(){
  const p0=pre;pre={};
  const people=Object.values(P).filter(p=>p.id!==me.id&&(staff()||['teacher','director'].includes(p.role)));
  const cats=[['role:teacher','Wszyscy nauczyciele'],['role:director','Dyrekcja']];
  if(staff())cats.push(['role:parent','Wszyscy rodzice'],['role:student','Wszyscy uczniowie'],...C.flatMap(c=>[[`class:${c.id}:parent`,`Rodzice klasy ${c.name}`],[`class:${c.id}:student`,`Uczniowie klasy ${c.name}`]]));
  return `<div class="card"><h2>Nowa wiadomość</h2><div class="grid md:grid-cols-2 gap-2">
   <label class="text-sm font-semibold">Kategorie (Ctrl/Cmd = wiele)<select id="cat" multiple size="6">${cats.map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join('')}</select></label>
   <label class="text-sm font-semibold">Osoby<select id="to" multiple size="6">${people.map(p=>`<option value="${p.id}" ${p0.to===p.id?'selected':''}>${esc(nm(p.id))} (${RL[p.role]})</option>`).join('')}</select></label></div>

async function sendMsg(){

  for(const o of $('#cat').selectedOptions){const[k,a,b]=o.value.split(':');Object.values(P).forEach(p=>{if(p.id===me.id)return;if(k==='role'&&p.role===a)set.add(p.id);if(k==='class'&&p.role===b&&inClass(p.id,a))set.add(p.id)})}
  if(!set.size||!v('sub').trim()||!v('body').trim())return warn('Wybierz odbiorców i uzupełnij temat oraz treść.');
  await act(sb.rpc('send_message',{p_subject:v('sub').trim(),p_body:v('body').trim(),p_to:[...set]}),()=>{mtab='out';render()},'Wysłano do '+set.size+' os.');

async function openMsg(id,silent){

  await sb.from('message_recipients').update({read_at:new Date().toISOString()}).eq('message_id',id).eq('recipient_id',me.id).is('read_at',null);
  let rec='';if(m.sender_id===me.id){const {data}=await sb.from('message_recipients').select('recipient_id,read_at').eq('message_id',id);rec=`<p class="text-sm text-slate-500">Do: ${(data||[]).map(r=>esc(nm(r.recipient_id))+(r.read_at?' <span title="przeczytana" class="text-green-600">✓</span>':'')).join(', ')}</p>`}
  const d=m.recalled_at?new Date(m.recalled_at):null;
  detail=id;rid++;
  $('#main').innerHTML=`<div class="view${silent===true?' silent':''}"><div class="card"><button class="b2" onclick="detail=null;render()">← Wróć</button><h2 class="mt-3">${esc(m.subject)}</h2><p class="text-sm text-slate-500">Od: ${esc(nm(m.sender_id))} · ${fd(m.created_at)}</p>${rec}
   ${d?`<p class="mt-3 italic text-slate-500">Ta wiadomość została usunięta przez nadawcę w dniu ${d.toLocaleDateString('pl-PL')} o godzinie ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}.</p>`:`<p class="mt-3 whitespace-pre-wrap">${esc(m.body)}</p>`}
   <div class="flex gap-2 mt-4">${!d&&m.sender_id!==me.id?`<button class="b" onclick="reply('${m.sender_id}','${encodeURIComponent(m.subject).replace(/'/g,'%27')}')">Odpowiedz</button>`:''}${!d&&m.sender_id===me.id&&staff()?`<button class="b" onclick="recall('${id}')">Wycofaj wiadomość</button>`:''}</div></div></div>`;

}

const setHome=(id,t)=>act(sb.from('classes').update({homeroom_teacher_id:t||null}).eq('id',id),load);
const setClass=(id,c)=>act(sb.from('students').update({class_id:c||null}).eq('profile_id',id),load);
const addTeach=()=>act(sb.from('teaching').insert({class_id:v('tc'),subject_id:v('ts'),teacher_id:v('tt')}),reload);
const addTT=c=>act(sb.from('timetable').insert({class_id:c,teaching_id:v('pt'),weekday:+v('pd'),lesson_no:+v('pn')}),reload);
const delRow=async(t,id)=>await ask('Usunąć pozycję?','Usuń')&&act(sb.from(t).delete().eq('id',id),reload,'Usunięto');

async function createAcc(){
  const w=window.open('','_blank'); // otwarte od razu (blokada popupów)
  const role=v('cr'),body={action:'create',role,first_name:v('cf'),last_name:v('cl')};
  if(role==='student')Object.assign(body,{class_id:v('cc')||null,birth_date:v('cb')||null,mother:v('cm'),father:v('cfa'),guardian:v('cg')});
  else Object.assign(body,{subject_ids:[...$('#csub').selectedOptions].map(o=>o.value),class_id:v('chr')||null});
  const {data,error}=await sb.functions.invoke('admin-users',{body});
  if(error||data?.error){w&&w.close();return warn(data?.error||error.message)}
  printAccts(w,data.accounts);toast('Konto utworzone — otwarto wydruk');reload();
}
async function resetPw(id){
  if(!await ask('Wygenerować nowe hasło jednorazowe? Stare przestanie działać.','Resetuj'))return;
  const w=window.open('','_blank'),{data,error}=await sb.functions.invoke('admin-users',{body:{action:'reset',user_id:id}});
  if(error||data?.error){w&&w.close();return warn(data?.error||error.message)}
  printAccts(w,data.accounts);
}
function printAccts(w,a){
  const rl={...RL,parent:'Rodzic / opiekun'};
  w.document.write(`<!DOCTYPE html><meta charset="utf-8"><title>Dane dostępowe</title><style>body{font-family:'Open Sans',Arial,sans-serif;margin:0}.c{border:2px solid #1E2A78;border-radius:12px;padding:24px;margin:24px auto;max-width:520px;page-break-inside:avoid}.s{color:#1E2A78;font-weight:800;font-size:18px}h1{margin:6px 0 2px}.r{margin:12px 0;font-size:14px;color:#555}b.m{font-family:monospace;font-size:22px;background:#fef3c7;padding:2px 8px;border-radius:6px}p.n{font-size:12px;color:#777}.t{text-align:center;margin:16px}@media print{.t{display:none}}</style>
  <div class="t"><button onclick="print()">Drukuj</button></div>`+a.map(x=>`<div class="c"><div class="s">${esc(school)} — Dziennik Minerva</div><h1>${esc(x.name)}</h1><div class="r">Rodzaj konta: <b>${rl[x.role]}</b></div><div class="r">Login: <b class="m">${esc(x.login)}</b></div><div class="r">Hasło jednorazowego dostępu: <b class="m">${esc(x.password)}</b></div><p class="n">Po pierwszym zalogowaniu na stronie /login system poprosi o ustawienie własnego hasła. Hasło jednorazowe działa tylko do tego momentu.</p></div>`).join(''));
  w.document.close();
}
