<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie — Minerva</title>
<link rel="icon" type="image/svg+xml" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Open Sans"','sans-serif']},colors:{indigoBrand:'#1E2A78',indigoDark:'#141D56',amberBrand:'#F5A524'}}}}
</script>
<style>
body{font-family:'Open Sans',sans-serif}
.btn-fill{position:relative;overflow:hidden;z-index:1;background:#1E2A78;color:#fff;transition:color .35s,box-shadow .35s,transform .25s}
.btn-fill::before{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:#F5A524;transform:translate(-50%,-50%);transition:width .55s,height .55s;z-index:-1}
.btn-fill:hover::before{width:320%;height:600%}
.btn-fill:hover{color:#1E2A78;transform:translateY(-1px);box-shadow:0 12px 28px -6px rgba(245,165,36,.45)}
.btn-fill:disabled{opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.btn-fill,.btn-fill::before{transition:none}}
</style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-slate-50 via-indigo-50/40 to-amber-50/30 text-slate-800 antialiased">
<header class="bg-[#080B1A] px-6 py-4 flex items-center justify-between shadow-md">
  <a href="/"><img src="https://dziennik-minerva.pages.dev/themes/logo-horizontal-white.svg" alt="Minerva" class="h-10 w-auto"></a>
  <a href="/" class="text-white/80 hover:text-amberBrand text-sm font-semibold">← Strona główna</a>
</header>

<main class="flex-1 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-200 p-8 sm:p-10">
    <h1 class="text-2xl font-extrabold text-indigoBrand">Logowanie do dziennika</h1>
    <p class="text-sm text-slate-500 mt-1 mb-7">Login i hasło otrzymasz od dyrektora szkoły.</p>
    <form id="f" class="space-y-5">
      <div>
        <label for="login" class="block text-sm font-semibold text-slate-700 mb-1.5">Login</label>
        <input id="login" required autocomplete="username" autocapitalize="off" spellcheck="false" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigoBrand focus:ring-4 focus:ring-indigoBrand/15 outline-none text-sm">
      </div>
      <div>
        <label for="pass" class="block text-sm font-semibold text-slate-700 mb-1.5">Hasło</label>
        <input id="pass" type="password" required autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigoBrand focus:ring-4 focus:ring-indigoBrand/15 outline-none text-sm">
      </div>
      <p id="err" role="alert" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-semibold"></p>
      <button id="btn" class="btn-fill w-full py-3.5 rounded-xl font-bold">Zaloguj się</button>
    </form>
    <p class="mt-6 text-xs text-slate-500">Pierwsze logowanie? Po wpisaniu hasła jednorazowego system poprosi o ustawienie własnego.</p>
  </div>
</main>
<footer class="bg-[#050711] text-white/70 py-5 text-center text-xs">&copy; 2026 Minerva. Wszelkie prawa zastrzeżone.</footer>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://xodfwrgkudllvfdetljw.supabase.co','sb_publishable_FY5C7kLlrQZDQooJ54klMQ_il0jVpsJ');
const EMAIL_DOMAIN='@minerva-dziennik.pl';
const {data:{session}}=await sb.auth.getSession();
if(session) location.href='/dziennik';
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'), btn=document.getElementById('btn');
  err.classList.add('hidden'); btn.disabled=true;
  const login=document.getElementById('login').value.trim().toLowerCase();
  const {error}=await sb.auth.signInWithPassword({email:login+EMAIL_DOMAIN,password:document.getElementById('pass').value});
  if(error){ err.textContent='Nieprawidłowy login lub hasło.'; err.classList.remove('hidden'); btn.disabled=false; return; }
  location.href='/dziennik';
});
</script>
</body>
</html>
