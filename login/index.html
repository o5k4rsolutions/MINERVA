<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logowanie — Minerva</title>
<link rel="icon" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>body{font-family:'Open Sans',sans-serif}input{border:1px solid #cbd5e1;border-radius:.6rem;padding:.65rem .8rem;width:100%}input:focus{outline:2px solid #F5A524;border-color:transparent}
.b{background:#F5A524;color:#1E2A78;font-weight:700;border-radius:.6rem;padding:.7rem;width:100%;transition:.2s}.b:hover{background:#1E2A78;color:#fff}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#080B1A] to-[#1E2A78] flex items-center justify-center p-4">
<main class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
  <img src="https://dziennik-minerva.pages.dev/themes/icon-dark.svg" alt="" class="h-12 mx-auto mb-2">
  <h1 class="text-2xl font-extrabold text-center text-[#1E2A78]">Dziennik Minerva</h1>
  <p id="sub" class="text-center text-slate-500 text-sm mb-6">Zaloguj się loginem otrzymanym w szkole</p>
  <p id="err" class="hidden bg-red-50 text-red-700 text-sm rounded-lg p-2 mb-3"></p>

  <form id="f1" class="space-y-3">
    <label class="block text-sm font-semibold">Login<input id="login" autocomplete="username" required></label>
    <label class="block text-sm font-semibold">Hasło<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="b">Zaloguj</button>
  </form>

  <form id="f2" class="space-y-3 hidden">
    <p class="text-sm bg-amber-50 border border-amber-200 rounded-lg p-2">To Twoje pierwsze logowanie. Ustaw własne hasło (min. 8 znaków), hasło jednorazowe przestanie działać.</p>
    <label class="block text-sm font-semibold">Nowe hasło<input id="n1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="block text-sm font-semibold">Powtórz hasło<input id="n2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="b">Zapisz i wejdź</button>
  </form>
  <p class="text-center text-xs text-slate-400 mt-6">Nie masz danych? Zgłoś się do administratora placówki.</p>
</main>
<script>
const sb=supabase.createClient('https://tsoxtjxfskvgiruraoau.supabase.co','sb_publishable_oU23IIberCIeZksCjK5dFA_iMd0cNZB');
const $=s=>document.querySelector(s), DOMAIN='@minerva.local';
const err=m=>{const e=$('#err');e.textContent=m;e.classList.toggle('hidden',!m)};
const showChange=()=>{$('#f1').classList.add('hidden');$('#f2').classList.remove('hidden');$('#sub').textContent='Ustaw własne hasło'};

(async()=>{ // już zalogowany?
  const {data:{session}}=await sb.auth.getSession(); if(!session)return;
  const {data:p}=await sb.from('profiles').select('must_change_password').eq('id',session.user.id).single();
  p?.must_change_password?showChange():location.href='/dziennik';
})();

$('#f1').onsubmit=async e=>{
  e.preventDefault();err('');
  const {data,error}=await sb.auth.signInWithPassword({email:$('#login').value.trim().toLowerCase()+DOMAIN,password:$('#pw').value});
  if(error)return err('Nieprawidłowy login lub hasło.');
  await sb.rpc('touch_login');
  const {data:p}=await sb.from('profiles').select('must_change_password').eq('id',data.user.id).single();
  p?.must_change_password?showChange():location.href='/dziennik';
};
$('#f2').onsubmit=async e=>{
  e.preventDefault();err('');
  if($('#n1').value!==$('#n2').value)return err('Hasła nie są takie same.');
  if($('#n1').value===$('#pw').value)return err('Nowe hasło musi różnić się od jednorazowego.');
  const {error}=await sb.auth.updateUser({password:$('#n1').value});
  if(error)return err(error.message);
  await sb.rpc('finish_password_change'); location.href='/dziennik';
};
</script>
</body>
</html>
