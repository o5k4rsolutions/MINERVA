<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie do systemu — Minerva</title>
    <link rel="icon" type="image/svg+xml" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Open Sans"', 'sans-serif'] },
                    colors: {
                        indigoBrand: '#1E2A78',
                        indigoDark: '#141D56',
                        amberBrand: '#F5A524',
                        amberLight: '#FFB946',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #F8FAFC; color: #1E293B; }
        .btn-center-fill {
            position: relative; overflow: hidden; z-index: 1;
            transition: color 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.35s ease, transform 0.25s ease, box-shadow 0.35s ease;
        }
        .btn-center-fill::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0; border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: -1;
        }
        .btn-center-fill:hover::before { width: 320%; height: 600%; }
        .btn-amber-to-indigo { background-color: #F5A524; color: #FFFFFF; }
        .btn-amber-to-indigo::before { background-color: #1E2A78; }
        .btn-amber-to-indigo:hover { color: #FFFFFF !important; box-shadow: 0 12px 28px -6px rgba(30, 42, 120, 0.4); transform: translateY(-2px); }
        .btn-indigo-to-amber { background-color: #1E2A78; color: #FFFFFF; }
        .btn-indigo-to-amber::before { background-color: #F5A524; }
        .btn-indigo-to-amber:hover { color: #1E2A78 !important; box-shadow: 0 12px 28px -6px rgba(245, 165, 36, 0.45); transform: translateY(-2px); }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-12px) rotate(calc(var(--rot, 0deg) + 3deg)); }
        }
        .owl-float { animation: floatSlow 7s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-amberBrand selection:text-indigoBrand bg-gradient-to-br from-slate-50 via-indigo-50/30 to-amber-50/20 relative overflow-x-hidden">

    <div class="absolute inset-0 pointer-events-none select-none overflow-hidden" aria-hidden="true">
        <svg class="absolute top-12 left-12 w-32 h-32 text-indigoBrand/10 owl-float" style="--rot: -15deg;" viewBox="0 0 100 100" fill="currentColor">
            <path d="M20 22 L32 32 Q50 26 68 32 L80 22 L82 54 C82 76 66 88 50 92 C34 88 18 76 18 54 Z"/>
            <circle cx="37" cy="52" r="11" fill="#F8FAFC"/><circle cx="63" cy="52" r="11" fill="#F8FAFC"/>
            <circle cx="37" cy="52" r="5" fill="currentColor"/><circle cx="63" cy="52" r="5" fill="currentColor"/>
            <polygon points="46,63 54,63 50,71" fill="#F8FAFC"/>
        </svg>
        <svg class="absolute bottom-12 right-12 w-36 h-36 text-amberBrand/15 owl-float" style="--rot: 20deg;" viewBox="0 0 100 100" fill="currentColor">
            <path d="M20 22 L32 32 Q50 26 68 32 L80 22 L82 54 C82 76 66 88 50 92 C34 88 18 76 18 54 Z"/>
            <circle cx="37" cy="52" r="11" fill="#F8FAFC"/><circle cx="63" cy="52" r="11" fill="#F8FAFC"/>
            <circle cx="37" cy="52" r="5" fill="currentColor"/><circle cx="63" cy="52" r="5" fill="currentColor"/>
            <polygon points="46,63 54,63 50,71" fill="#F8FAFC"/>
        </svg>
    </div>

    <header class="bg-[#080B1A] border-b border-white/10 px-6 py-4 flex items-center justify-between shadow-md z-20">
        <a href="/" class="flex items-center group">
            <img src="https://dziennik-minerva.pages.dev/themes/logo-horizontal-white.svg" alt="Minerva Logo" class="h-10 w-auto transition-transform group-hover:scale-105">
        </a>
        <a href="/" class="text-white/80 hover:text-amberBrand text-sm font-semibold transition-colors flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Wróć na stronę główną
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 z-10">
        <div class="w-full max-w-md bg-white/90 backdrop-blur-xl rounded-[32px] shadow-2xl border border-slate-200/90 p-8 sm:p-10 relative overflow-hidden">
            <div class="absolute -top-14 -right-14 w-40 h-40 bg-amberBrand/15 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-14 -left-14 w-40 h-40 bg-indigoBrand/15 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center mb-8 relative z-10">
                <div class="inline-flex items-center justify-center w-18 h-18 rounded-3xl bg-indigoBrand text-amberBrand mb-4 shadow-xl shadow-indigoBrand/25">
                    <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-indigoBrand tracking-tight">Logowanie do systemu</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1.5">Wprowadź login oraz hasło przypisane do placówki w bazie Supabase</p>
            </div>

            <form id="loginForm" class="space-y-5 relative z-10" onsubmit="handleSupabaseLogin(event)">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Login użytkownika</label>
                    <input type="text" id="loginInput" required placeholder="np. dyrektor.sp1" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:border-indigoBrand focus:ring-4 focus:ring-indigoBrand/15 outline-none text-sm transition-all font-medium">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Hasło</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-4 py-3.5 rounded-2xl border border-slate-300 focus:border-indigoBrand focus:ring-4 focus:ring-indigoBrand/15 outline-none text-sm transition-all font-medium">
                </div>

                <div id="loginError" class="hidden p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-600 text-xs font-semibold text-center"></div>

                <button type="submit" id="submitBtn" class="btn-center-fill btn-indigo-to-amber w-full py-4 rounded-2xl font-bold text-base shadow-lg shadow-indigoBrand/25 flex items-center justify-center gap-2">
                    <span>Zaloguj się</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-500 relative z-10">
                Połączone z bezpieczną bazą danych <span class="font-bold text-indigoBrand">Supabase Cloud</span>.
            </div>
        </div>
    </main>

    <footer class="bg-[#050711] text-white py-6 px-6 text-center text-xs text-white/70 z-20">
        &copy; 2026 Minerva. Wszelkie prawa zastrzeżone.
    </footer>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = typeof __supabase_url !== 'undefined' ? __supabase_url : 'https://xodfwrgkudllvfdetljw.supabase.co';
        const SUPABASE_ANON_KEY = typeof __supabase_anon_key !== 'undefined' ? __supabase_anon_key : 'sb_publishable_FY5C7kLlrQZDQooJ54klMQ_il0jVpsJ';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.handleSupabaseLogin = async function(e) {
            e.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const errBox = document.getElementById('loginError');
            const btn = document.getElementById('submitBtn');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                // Zapytanie do tabeli users_profile w Supabase
                const { data, error } = await supabase
                    .from('users_profile')
                    .select('*')
                    .eq('login', login)
                    .single();

                if (error || !data) {
                    throw new Error('Nie znaleziono użytkownika o takim loginie.');
                }

                // Weryfikacja hasła (dla uproszczenia demo sprawdzamy pole pass lub supabase auth)
                if (data.pass && data.pass !== pass) {
                    throw new Error('Nieprawidłowe hasło.');
                }

                localStorage.setItem('minerva_current_user', JSON.stringify(data));
                window.location.href = '/dziennik';

            } catch (err) {
                // Tryb zapasowy localStorage w przypadku braków połączenia z Supabase
                const localDb = JSON.parse(localStorage.getItem('minerva_db_v2') || '{"users":[]}');
                const foundLocal = localDb.users.find(u => u.login === login && u.pass === pass);
                if (foundLocal) {
                    localStorage.setItem('minerva_current_user', JSON.stringify(foundLocal));
                    window.location.href = '/dziennik';
                    return;
                }

                errBox.textContent = err.message || 'Błąd logowania do systemu.';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        };
    </script>
</body>
</html>

    <script>
        let dbState = {
            users: [
                { id: 'u1', login: 'DYR0218', pass: 'OSKIBOSKI', name: 'Oskar Olenowski', role: 'Dyrektor', schoolName: 'SPS 220769', mustChangePass: false, subjects: ['Matematyka', 'Informatyka'], classId: '4a' },
                ]
        };

        function loadState() {
            const saved = localStorage.getItem('minerva_db_v2');
            if (saved) { try { dbState = JSON.parse(saved); } catch(e){} }
            else { localStorage.setItem('minerva_db_v2', JSON.stringify(dbState)); }
        }
        loadState();

        function handleLogin(e) {
            e.preventDefault();
            const login = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            const errBox = document.getElementById('loginError');

            const found = dbState.users.find(u => u.login === login && u.pass === pass);
            if (!found) {
                errBox.textContent = 'Nieprawidłowy login lub hasło.';
                errBox.classList.remove('hidden');
                return;
            }

            localStorage.setItem('minerva_current_user', JSON.stringify(found));
            window.location.href = '/dziennik';
        }
    </script>
</body>
</html>
