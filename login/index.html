<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2A78"><meta name="color-scheme" content="light">
<title>Logowanie — Minerva</title>
<link rel="icon" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;font-family:'Inter','Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;color:#fff;
 background:radial-gradient(900px 520px at 15% -10%,#3445C2 0%,#3445C200 60%),radial-gradient(700px 520px at 100% 110%,#4a2f9a 0%,#4a2f9a00 55%),linear-gradient(160deg,#101659,#1E2A78 55%,#0c1034)}
@media(min-width:768px){body{justify-content:center;align-items:center}.lgt{flex:0 0 auto;padding-bottom:1.6rem}.lgs{border-radius:28px;margin:0 auto 2rem}}
.hidden{display:none!important}
.lgo{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:lgo 8s ease-in-out infinite alternate}
.lgo.o1{width:60vmax;height:60vmax;left:-20vmax;top:-22vmax;background:#3d52d9;opacity:.5}
.lgo.o2{width:46vmax;height:46vmax;right:-16vmax;bottom:-18vmax;background:#F5A524;opacity:.22;animation-delay:-3s}
@keyframes lgo{to{transform:translate(4vmax,3vmax) scale(1.12)}}
.lgt{position:relative;flex:1 1 auto;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:calc(env(safe-area-inset-top,0px) + 1.5rem) 1.5rem 1.2rem;animation:lgf .8s both}
.lgt img{width:min(62vw,300px);height:auto}.lgt p{margin:0;color:#ffffffb0;font-size:.72rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
@keyframes lgf{from{opacity:0;transform:translateY(14px)}}
.lgs{position:relative;width:100%;max-width:480px;margin:0 auto;background:#fff;color:#151B3A;border-radius:32px 32px 0 0;padding:1.7rem 1.4rem calc(1.4rem + env(safe-area-inset-bottom,0px));box-shadow:0 -24px 60px -20px #0008;animation:lgu .55s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes lgu{from{transform:translateY(60px);opacity:0}}
.lgs h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.lgsub{margin:.3rem 0 1.3rem;color:#6B7694;font-size:.92rem}
.lgf{display:block;margin-bottom:1rem}.lgf>span{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#6B7694;margin-bottom:.4rem}
.lgw{position:relative}.lgi{position:absolute;left:1rem;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#9AA4C0;pointer-events:none}
.lgw input{width:100%;height:56px;border:1.5px solid transparent;border-radius:16px;padding:0 3rem 0 3rem;font:inherit;font-size:16px;background:#F3F5FB;color:#151B3A;transition:.15s}
.lgw input:focus{outline:0;background:#fff;border-color:#1E2A78;box-shadow:0 0 0 4px #1e2a7818}
.lg-eye{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:#9AA4C0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.lg-eye svg{width:22px;height:22px}.lg-eye:active{background:#EEF0FD;color:#1E2A78}
.lgb{width:100%;height:56px;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:1.02rem;background:linear-gradient(135deg,#FFB93B,#F5A524);color:#2a1b00;display:flex;align-items:center;justify-content:center;gap:.6rem;box-shadow:0 12px 24px -12px #f5a524;transition:transform .15s,opacity .15s;cursor:pointer}
.lgb:active{transform:scale(.97)}.lgb:disabled{opacity:.7;cursor:wait}
.lgs2{width:20px;height:20px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:none}.lgb:disabled .lgs2{display:inline-block}
#lger,.lger{display:none;align-items:flex-start;gap:.5rem;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:14px;padding:.7rem .9rem;font-size:.88rem;margin:0 0 1rem}
#lger.show,.lger.show{display:flex}
.lgh2{display:none;font-size:.78rem;color:#B45309;margin:-.4rem 0 1rem}.lgh2.show{display:block}
.lgq{list-style:none;padding:0;margin:0 0 1.2rem;font-size:.84rem;color:#6B7694}.lgq li{display:flex;align-items:center;gap:.55rem;padding:.18rem 0}
.lgq i{width:18px;height:18px;border-radius:50%;border:1.5px solid #CBD3E1;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.65rem;color:transparent;flex-shrink:0}
.lgq li.ok{color:#15803D}.lgq li.ok i{background:#15803D;border-color:#15803D;color:#fff}
.lgfoot{margin:1.4rem 0 0;text-align:center;font-size:.76rem;color:#9AA4C0;line-height:1.5}
.lg-h{display:none!important}
@keyframes rot{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<i class="lgo o1"></i><i class="lgo o2"></i>
<div class="lgt"><img src="https://dziennik-minerva.pages.dev/themes/logo-horizontal-white.svg" alt="Minerva" onerror="this.style.display='none'"><p>Dziennik elektroniczny</p></div>
<main class="lgs">
  <h1 id="ttl">Zaloguj się</h1><p class="lgsub" id="sub">Użyj loginu otrzymanego w szkole</p>
  <p id="err" class="lger" role="alert"><span id="errt"></span></p>

  <form id="f1" novalidate>
    <label class="lgf"><span>Login</span><div class="lgw"><svg class="lgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <input id="login" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="np. jan.kowalski" enterkeyhint="next" required></div></label>
    <label class="lgf"><span>Hasło</span><div class="lgw"><svg class="lgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Twoje hasło" enterkeyhint="go" required>
      <button type="button" class="lg-eye" data-t="pw" aria-label="Pokaż hasło"></button></div></label>
    <p id="caps" class="lgh2">Włączony jest Caps Lock.</p>
    <button class="lgb" id="b1"><i class="lgs2"></i><span>Zaloguj się</span></button>
  </form>

  <form id="f2" class="hidden" novalidate>
    <label class="lgf"><span>Nowe hasło</span><div class="lgw"><svg class="lgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input id="n1" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="lg-eye" data-t="n1" aria-label="Pokaż hasło"></button></div></label>
    <label class="lgf"><span>Powtórz hasło</span><div class="lgw"><svg class="lgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      <input id="n2" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="lg-eye" data-t="n2" aria-label="Pokaż hasło"></button></div></label>
    <ul class="lgq"><li id="r1"><i>✓</i>Co najmniej 8 znaków</li><li id="r2"><i>✓</i>Różne od hasła jednorazowego</li><li id="r3"><i>✓</i>Oba hasła są takie same</li></ul>
    <button class="lgb" id="b2"><i class="lgs2"></i><span>Zapisz i wejdź</span></button>
  </form>

  <p class="lgfoot">Konta zakłada wyłącznie dyrekcja szkoły.<br>Nie masz danych? Zgłoś się do sekretariatu.</p>
</main>
<script>
const sb=supabase.createClient('https://tsoxtjxfskvgiruraoau.supabase.co','sb_publishable_oU23IIberCIeZksCjK5dFA_iMd0cNZB');
const $=s=>document.querySelector(s), DOMAIN='@minerva.local';
const err=m=>{$('#errt').textContent=m;$('#err').classList.toggle('show',!!m)};
const busy=(b,on)=>{$(b).disabled=on};
const showChange=()=>{$('#f1').classList.add('hidden');$('#f2').classList.remove('hidden');$('#ttl').textContent='Ustaw własne hasło';$('#sub').textContent='To Twoje pierwsze logowanie. Hasło jednorazowe przestanie działać.';$('#n1').focus()};
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 EYE0='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.7 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 004.4-1M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
document.querySelectorAll('.lg-eye').forEach(b=>{b.innerHTML=EYE;b.onclick=()=>{const i=$('#'+b.dataset.t),h=i.type==='password';i.type=h?'text':'password';b.innerHTML=h?EYE0:EYE;b.setAttribute('aria-label',h?'Ukryj hasło':'Pokaż hasło')}});
$('#pw').addEventListener('keyup',e=>$('#caps').classList.toggle('show',!!e.getModifierState&&e.getModifierState('CapsLock')));
$('#login').addEventListener('input',()=>err(''));$('#pw').addEventListener('input',()=>err(''));
const rq=()=>{const a=$('#n1').value,b=$('#n2').value,set=(id,ok)=>$('#'+id).classList.toggle('ok',ok);set('r1',a.length>=8);set('r2',a.length>0&&a!==$('#pw').value);set('r3',a.length>0&&a===b)};
$('#n1').addEventListener('input',rq);$('#n2').addEventListener('input',rq);

(async()=>{ // już zalogowany?
  const {data:{session}}=await sb.auth.getSession(); if(!session)return;
  const {data:p,error}=await sb.from('profiles').select('must_change_password').eq('id',session.user.id).maybeSingle();
  if(error||!p){await sb.auth.signOut();return err('Nie można odczytać profilu ('+(error?.message||'brak wpisu w profiles')+'). Wylogowano.')}
  p.must_change_password?showChange():location.href='/dziennik';
})();

$('#f1').onsubmit=async e=>{
  e.preventDefault();err('');
  if(!$('#login').value.trim()||!$('#pw').value)return err('Podaj login i hasło.');
  busy('#b1',true);
  const {data,error}=await sb.auth.signInWithPassword({email:$('#login').value.trim().toLowerCase()+DOMAIN,password:$('#pw').value});
  if(error){busy('#b1',false);return err('Nieprawidłowy login lub hasło.')}
  await sb.rpc('touch_login');
  const {data:p,error:pe}=await sb.from('profiles').select('must_change_password').eq('id',data.user.id).maybeSingle();
  if(pe||!p){await sb.auth.signOut();busy('#b1',false);return err('Zalogowano, ale nie można odczytać profilu ('+(pe?.message||'brak wpisu w profiles')+').')}
  if(p.must_change_password){busy('#b1',false);showChange()}else location.href='/dziennik';
};
$('#f2').onsubmit=async e=>{
  e.preventDefault();err('');
  if($('#n1').value.length<8)return err('Hasło musi mieć co najmniej 8 znaków.');
  if($('#n1').value!==$('#n2').value)return err('Hasła nie są takie same.');
  if($('#n1').value===$('#pw').value)return err('Nowe hasło musi różnić się od jednorazowego.');
  busy('#b2',true);
  const {error}=await sb.auth.updateUser({password:$('#n1').value});
  if(error){busy('#b2',false);return err(error.message)}
  const {error:e2}=await sb.rpc('finish_password_change');
  if(e2){busy('#b2',false);return err('Nie udało się zapisać zmiany hasła: '+e2.message)}
  location.href='/dziennik';
};
</script>
</body>
</html>
