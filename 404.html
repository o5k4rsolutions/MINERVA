<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Nie znaleziono strony | Minerva</title>
    <link rel="icon" type="image/svg+xml" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Open Sans"', 'sans-serif'],
                    },
                    colors: {
                        indigoBrand: '#1E2A78',
                        indigoDark: '#141D56',
                        amberBrand: '#F5A524',
                        amberLight: '#FFB946',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            overflow-x: hidden;
        }

        .btn-center-fill {
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: color 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        border-color 0.35s ease, 
                        transform 0.25s ease, 
                        box-shadow 0.35s ease;
        }

        .btn-center-fill::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        height 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: -1;
        }

        .btn-center-fill:hover::before,
        .btn-center-fill:focus-visible::before {
            width: 320%;
            height: 600%;
        }

        .btn-center-fill:active {
            transform: scale(0.97);
        }

        .btn-nav-amber::before {
            background-color: #F5A524;
        }
        .btn-nav-amber:hover {
            color: #1E2A78 !important;
            border-color: #F5A524 !important;
            box-shadow: 0 0 20px rgba(245, 165, 36, 0.45);
        }

        .btn-amber-to-indigo {
            background-color: #F5A524;
            color: #FFFFFF;
        }
        .btn-amber-to-indigo::before {
            background-color: #1E2A78;
        }
        .btn-amber-to-indigo:hover {
            color: #FFFFFF !important;
            box-shadow: 0 12px 28px -6px rgba(30, 42, 120, 0.4);
            transform: translateY(-2px);
        }

        .btn-indigo-to-amber {
            background-color: #1E2A78;
            color: #FFFFFF;
        }
        .btn-indigo-to-amber::before {
            background-color: #F5A524;
        }
        .btn-indigo-to-amber:hover {
            color: #1E2A78 !important;
            box-shadow: 0 12px 28px -6px rgba(245, 165, 36, 0.45);
            transform: translateY(-2px);
        }

        .btn-outline-indigo {
            background-color: transparent;
            border: 2px solid #1E2A78;
            color: #1E2A78;
        }
        .btn-outline-indigo::before {
            background-color: #1E2A78;
        }
        .btn-outline-indigo:hover {
            color: #FFFFFF !important;
        }

        @keyframes floatSlow {
            0%, 100% {
                transform: translateY(0px) rotate(var(--rot, 0deg));
            }
            50% {
                transform: translateY(-14px) rotate(calc(var(--rot, 0deg) + 4deg));
            }
        }

        @keyframes floatReverse {
            0%, 100% {
                transform: translateY(0px) rotate(var(--rot, 0deg));
            }
            50% {
                transform: translateY(12px) rotate(calc(var(--rot, 0deg) - 4deg));
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.25;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.4;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .owl-float-1 {
            animation: floatSlow 7s ease-in-out infinite;
        }
        .owl-float-2 {
            animation: floatReverse 8.5s ease-in-out infinite;
        }
        .owl-float-3 {
            animation: floatSlow 9.5s ease-in-out infinite 1.2s;
        }
        .glow-animate {
            animation: pulseGlow 5s ease-in-out infinite;
        }
        .fade-up-1 {
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .fade-up-2 {
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
        }
        .fade-up-3 {
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
        }

        .nav-link-center {
            position: relative;
        }
        .nav-link-center::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0;
            height: 2px;
            background-color: #F5A524;
            transition: width 0.3s ease, left 0.3s ease;
            border-radius: 999px;
        }
        .nav-link-center:hover::after {
            width: 100%;
            left: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-amberBrand selection:text-indigoBrand">

    <header class="sticky top-0 z-50 bg-[#080B1A]/95 backdrop-blur-md border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <a href="/" class="flex items-center group focus:outline-none">
                    <img 
                        src="https://dziennik-minerva.pages.dev/themes/logo-horizontal-white.svg" 
                        alt="Minerva Logo" 
                        class="h-10 sm:h-11 w-auto transition-transform duration-300 group-hover:scale-105"
                        onerror="this.onerror=null; this.src='https://placehold.co/180x44/080B1A/FFFFFF?text=Minerva';"
                    >
                </a>

                <nav class="hidden md:flex items-center space-x-8">
                    <a 
                        href="/login" 
                        class="btn-center-fill btn-nav-amber border-2 border-white/80 text-white font-bold text-sm px-7 py-2.5 rounded-xl inline-block">
                        Przejdź do dziennika
                    </a>
                </nav>

                <div class="md:hidden flex items-center gap-3">
                    <a 
                        href="/login" 
                        class="btn-center-fill btn-nav-amber border border-white/80 text-white font-semibold text-xs px-4 py-2 rounded-lg inline-block">
                        Przejdź do dziennika
                    </a>
                    <button id="mobileMenuBtn" aria-label="Otwórz menu" class="text-white hover:text-amberBrand p-2 rounded-lg transition-colors">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobileMenu" class="hidden md:hidden bg-[#0D122B] border-t border-white/10 px-4 pt-3 pb-5 space-y-2">
            <a href="/login" class="mobile-link block px-4 py-3 rounded-xl text-white font-semibold hover:bg-indigoBrand/50 hover:text-amberBrand transition-colors">
                Zaloguj się
            </a>
        </div>
    </header>

    <main class="relative flex-1 flex items-center justify-center py-16 sm:py-24 px-4 sm:px-6 lg:px-8 overflow-hidden bg-gradient-to-b from-[#F8FAFC] via-white to-[#F1F5F9]">
        
        <div class="absolute inset-0 pointer-events-none select-none overflow-hidden" aria-hidden="true">
            <svg class="absolute top-10 left-[6%] w-28 sm:w-36 h-28 sm:h-36 text-slate-400/20 owl-float-1" style="--rot: -18deg;" viewBox="0 0 100 100" fill="currentColor">
                <path d="M20 22 L32 32 Q50 26 68 32 L80 22 L82 54 C82 76 66 88 50 92 C34 88 18 76 18 54 Z"/>
                <circle cx="37" cy="52" r="11" fill="#F8FAFC"/><circle cx="63" cy="52" r="11" fill="#F8FAFC"/>
                <circle cx="37" cy="52" r="5" fill="currentColor"/><circle cx="63" cy="52" r="5" fill="currentColor"/>
                <polygon points="46,63 54,63 50,71" fill="#F8FAFC"/>
            </svg>

            <svg class="absolute top-14 right-[8%] w-24 sm:w-32 h-24 sm:h-32 text-slate-400/20 owl-float-2" style="--rot: 22deg;" viewBox="0 0 100 100" fill="currentColor">
                <path d="M20 22 L32 32 Q50 26 68 32 L80 22 L82 54 C82 76 66 88 50 92 C34 88 18 76 18 54 Z"/>
                <circle cx="37" cy="52" r="11" fill="#F8FAFC"/><circle cx="63" cy="52" r="11" fill="#F8FAFC"/>
                <circle cx="37" cy="52" r="5" fill="currentColor"/><circle cx="63" cy="52" r="5" fill="currentColor"/>
                <polygon points="46,63 54,63 50,71" fill="#F8FAFC"/>
            </svg>

            <svg class="absolute bottom-12 left-[10%] w-32 sm:w-40 h-32 sm:h-40 text-slate-400/20 owl-float-3" style="--rot: 14deg;" viewBox="0 0 100 100" fill="currentColor">
                <path d="M20 22 L32 32 Q50 26 68 32 L80 22 L82 54 C82 76 66 88 50 92 C34 88 18 76 18 54 Z"/>
                <circle cx="37" cy="52" r="11" fill="#F8FAFC"/><circle cx="63" cy="52" r="11" fill="#F8FAFC"/>
                <circle cx="37" cy="52" r="5" fill="currentColor"/><circle cx="63" cy="52" r="5" fill="currentColor"/>
                <polygon points="46,63 54,63 50,71" fill="#F8FAFC"/>
            </svg>

            <svg class="absolute bottom-14 right-[10%] w-28 sm:w-36 h-28 sm:h-36 text-slate-400/20 owl-float-1" style="--rot: -16deg;" viewBox="0 0 100 100" fill="currentColor">
                <path d="M20 22 L32 32 Q50 26 68 32 L80 22 L82 54 C82 76 66 88 50 92 C34 88 18 76 18 54 Z"/>
                <circle cx="37" cy="52" r="11" fill="#F8FAFC"/><circle cx="63" cy="52" r="11" fill="#F8FAFC"/>
                <circle cx="37" cy="52" r="5" fill="currentColor"/><circle cx="63" cy="52" r="5" fill="currentColor"/>
                <polygon points="46,63 54,63 50,71" fill="#F8FAFC"/>
            </svg>
        </div>

        <div class="relative z-10 max-w-2xl w-full text-center">
            
            <div class="fade-up-1 relative inline-flex items-center justify-center mb-6">
                <div class="absolute inset-0 bg-amberBrand/30 rounded-full blur-2xl glow-animate"></div>
                <svg class="w-36 h-36 sm:w-44 sm:h-44 relative z-10 drop-shadow-xl owl-float-1" viewBox="0 0 200 200" fill="none">
                    <path d="M44 48 L68 68 Q100 56 132 68 L156 48 L160 112 C160 154 130 176 100 184 C70 176 40 154 40 112 Z" fill="#1E2A78"/>
                    <path d="M62 118 C62 96 138 96 138 118 C138 152 120 170 100 176 C80 170 62 152 62 118 Z" fill="#28389E"/>
                    <circle cx="76" cy="102" r="22" fill="#FFFFFF"/>
                    <circle cx="124" cy="102" r="22" fill="#FFFFFF"/>
                    <circle id="pupilLeft" cx="79" cy="102" r="9" fill="#080B1A"/>
                    <circle id="pupilRight" cx="127" cy="102" r="9" fill="#080B1A"/>
                    <circle cx="82" cy="99" r="3" fill="#FFFFFF"/>
                    <circle cx="130" cy="99" r="3" fill="#FFFFFF"/>
                    <polygon points="92,120 108,120 100,136" fill="#F5A524"/>
                    <circle cx="134" cy="134" r="26" stroke="#F5A524" stroke-width="6" fill="#FFFFFF" fill-opacity="0.18"/>
                    <line x1="153" y1="153" x2="176" y2="176" stroke="#F5A524" stroke-width="8" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="fade-up-2">
                <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-indigoBrand/10 text-indigoBrand mb-4">
                    <span class="w-2 h-2 rounded-full bg-amberBrand animate-ping"></span>
                    Błąd 404
                </span>

                <div class="text-6xl sm:text-8xl font-extrabold tracking-tight leading-none mb-4 select-none">
                    <span class="text-indigoBrand">4</span><span class="text-amberBrand">0</span><span class="text-indigoBrand">4</span>
                </div>

                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-indigoBrand tracking-tight mb-3">
                    Ups! Tej strony <span class="text-amberBrand">nie znaleziono</span>
                </h1>

                <p class="text-sm sm:text-base md:text-lg text-slate-600 max-w-lg mx-auto leading-relaxed mb-8">
                    Wygląda na to, że strona, której szukasz, została przeniesiona, usunięta lub wpisano błędny adres URL.
                </p>
            </div>

            <div class="fade-up-3 flex flex-col sm:flex-row items-center justify-center gap-3.5">
                <a 
                    href="/" 
                    class="btn-center-fill btn-indigo-to-amber inline-flex items-center justify-center gap-2.5 font-bold text-sm sm:text-base px-8 py-3.5 rounded-full shadow-md w-full sm:w-auto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Wróć na stronę główną
                </a>

                <a 
                    href="/login" 
                    class="btn-center-fill btn-amber-to-indigo inline-flex items-center justify-center gap-2.5 font-bold text-sm sm:text-base px-8 py-3.5 rounded-full shadow-md w-full sm:w-auto">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Przejdź do dziennika
                </a>
            </div>

        </div>
    </main>

    <footer class="bg-[#050711] text-white py-10 px-4 sm:px-6 lg:px-8 border-t border-white/10">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
            <a href="/" class="flex items-center group">
                <img 
                    src="https://dziennik-minerva.pages.dev/themes/logo-horizontal-white.svg" 
                    alt="Minerva" 
                    class="h-10 sm:h-11 w-auto transition-transform duration-300 group-hover:scale-105"
                    onerror="this.onerror=null; this.src='https://placehold.co/180x44/050711/FFFFFF?text=Minerva';"
                >
            </a>
            <p class="text-sm sm:text-base text-white/90 text-center sm:text-right font-normal">
                &copy; 2026 Minerva. Wszelkie prawa zastrzeżone.
            </p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const mobileLinks = document.querySelectorAll('.mobile-link');

            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });

            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                });
            });

            const pupilLeft = document.getElementById('pupilLeft');
            const pupilRight = document.getElementById('pupilRight');

            document.addEventListener('mousemove', (e) => {
                if (!pupilLeft || !pupilRight) return;
                const xRatio = (e.clientX / window.innerWidth - 0.5) * 8;
                const yRatio = (e.clientY / window.innerHeight - 0.5) * 8;

                pupilLeft.setAttribute('cx', 76 + xRatio);
                pupilLeft.setAttribute('cy', 102 + yRatio);
                pupilRight.setAttribute('cx', 124 + xRatio);
                pupilRight.setAttribute('cy', 102 + yRatio);
            });
        });
    </script>
</body>
</html>
