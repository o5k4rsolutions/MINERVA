<script>

async function pgAll(mk){let all=[],f=0;for(;;){const {data,error}=await mk(f,f+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;f+=1000}return all}

/* ---------- start ---------- */
const hideSplash=()=>{const s=$('#splash');if(!s||s.dataset.h)return;s.dataset.h=1;setTimeout(()=>{s.classList.add('out');setTimeout(()=>s.remove(),700)},Math.max(0,1900-performance.now()))};
setTimeout(hideSplash,10000);
async function boot(){
  if(!gateCheck()){hideSplash();return}
  const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/login';return}
  const {data:m,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!m){hideSplash();return fatal('Błąd odczytu konta',error?.message||'Brak profilu użytkownika.')}
  me=m;
  const [p,c,s,t,st,sc]=await Promise.all([sb.from('profiles').select('*'),sb.from('classes').select('*').order('name'),sb.from('subjects').select('*'),sb.from('teaching').select('*'),sb.from('students').select('*'),sb.from('schools').select('name').single()]);
  for(const r of [p,c,s,t,st])if(r.error){hideSplash();return fatal('Błąd wczytywania danych',r.error.message)}
  P={};p.data.forEach(x=>P[x.id]=x);C=c.data;SUB=s.data;T=t.data;ST={};st.data.forEach(x=>ST[x.profile_id]=x);school=sc.data?.name||'';
  const mine=dir()?C:C.filter(c=>c.homeroom_teacher_id===me.id);
  if(!mine.length){hideSplash();return fatal('Brak dostępu','Aplikacja Świadectwa jest dostępna tylko dla wychowawców klas i dyrekcji.')}
  C=mine;year=defYear();cid=C[0].id;
  $('#selC').innerHTML=C.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#selY').innerHTML=[year-1,year,year+1].map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}/${y+1}</option>`).join('');
  $('#app').style.display='block';

const fatal=(t,m)=>{$('#app').style.display='none';const g=$('#gate');g.querySelector('.gi').textContent='⚠️';g.querySelector('h2').textContent=t;g.querySelector('p').textContent=m;g.classList.add('on')};
async function pickClass(v){cid=v;await loadClass()}
async function pickYear(y){year=y;await loadClass()}

async function loadClass(){
  $('#ed').innerHTML='<div class="sec"><p class="mu">Wczytywanie…</p></div>';
  const sts=students(),ids=sts.map(s=>s.id),r=yr();
  NOTES={};TG={};ATT={};CD={};sel=new Set(ids);stu=ids[0]||null;
  if(ids.length){
    try{
      const [n,g,a]=await Promise.all([
        pgAll((f,t)=>sb.from('notes').select('*').in('student_id',ids).gte('created_at',r.from).lte('created_at',r.to+'T23:59:59').order('created_at').range(f,t)),
        pgAll((f,t)=>sb.from('term_grades').select('*').in('student_id',ids).eq('term','y').eq('kind','final').range(f,t)).catch(()=>[]),
        pgAll((f,t)=>sb.from('attendance').select('student_id,status,date').in('student_id',ids).neq('status','present').gte('date',r.from).lte('date',r.to).range(f,t)).catch(()=>[])]);
      n.forEach(x=>(NOTES[x.student_id]??=[]).push(x));g.forEach(x=>TG[x.student_id+'|'+x.teaching_id]=x.value);a.forEach(x=>(ATT[x.student_id]??=[]).push(x));
    }catch(e){warn('Nie udało się pobrać wszystkich danych: '+(e.message||e))}

}
async function loadCD(ids){
  dbOK=true;let rows=[];
  const {data,error}=await sb.from('certificate_data').select('*').eq('school_year',year).in('student_id',ids);
  if(error){dbOK=false}else rows=data;
  ids.forEach(id=>{const db=rows.find(x=>x.student_id===id)?.data,ls=LS('cert:'+year+':'+id,null);CD[id]={...(ls||{}),...(db||{})}});
  if(!dbOK&&!bannerShown){bannerShown=true;warn('Tabela certificate_data nie jest jeszcze utworzona - dane zapisują się tylko w tej przeglądarce.')}
}
function saveCD(id){clearTimeout(saveT[id]);$('#sv')&&($('#sv').textContent='Zapisywanie…');
  saveT[id]=setTimeout(async()=>{
    LSset('cert:'+year+':'+id,CD[id]);
    if(dbOK){const {error}=await sb.from('certificate_data').upsert({student_id:id,school_year:year,data:CD[id],updated_by:me.id,updated_at:new Date().toISOString()},{onConflict:'student_id,school_year'});if(error){dbOK=false;warn('Zapis do bazy nie powiódł się (zapisano lokalnie): '+error.message)}}
    $('#sv')&&($('#sv').textContent=dbOK?'Zapisano w bazie ✓':'Zapisano lokalnie')},500)}

/* ---------- obliczenia ---------- */
const subjectsOf=()=>{const seen=new Set(),out=[];T.filter(t=>t.class_id===cid).forEach(t=>{if(!seen.has(t.subject_id)){seen.add(t.subject_id);out.push({sid:t.subject_id,tid:t.id,name:SUB.find(s=>s.id===t.subject_id)?.name||'-'})}});
  const idx=n=>{const i=ORDER.findIndex(r=>r.test(n.toLowerCase()));return i<0?99:i};return out.sort((a,b)=>idx(a.name)-idx(b.name)||a.name.localeCompare(b.name,'pl'))};
const cnts=id=>{const n=NOTES[id]||[];return{r:n.filter(x=>x.kind==='remark').length,p:n.filter(x=>x.kind==='praise').length}};
const behPts=id=>{const c=cnts(id);return RULES.start+c.p*RULES.plus-c.r*RULES.minus};
const behLbl=p=>p>=RULES.wz?BEH[0]:p>=RULES.bdb?BEH[1]:p>=RULES.db?BEH[2]:p>=RULES.pop?BEH[3]:p>=RULES.nieo?BEH[4]:BEH[5];
const behOf=id=>CD[id]?.behavior||behLbl(behPts(id));
const gradeOf=(id,s)=>{const o=CD[id]?.grades?.[s.sid];return o!==undefined&&o!==''?String(o):(TG[id+'|'+s.tid]||'')};
const avgOf=id=>{const v=subjectsOf().map(s=>+gradeOf(id,s)).filter(x=>x>=1&&x<=6);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const missing=id=>subjectsOf().filter(s=>!gradeOf(id,s)).length;
const fem=id=>{const g=CD[id]?.gender;if(g)return g==='f';const f=(P[id]?.first_name||'').trim();return /a$/i.test(f)&&!/^(kuba|barnaba|bonawentura|jarema|kosma|zawisza|jan[a]?$)/i.test(f)||/^(jana)$/i.test(f)};
const distAuto=id=>{const a=avgOf(id);return a!==null&&missing(id)===0&&a>=4.75&&['wzorowe','bardzo dobre'].includes(behOf(id))};
const dist=id=>{const d=CD[id]?.dist;return d==='yes'?true:d==='no'?false:distAuto(id)};
const failed=id=>subjectsOf().some(s=>gradeOf(id,s)==='1');
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
const nextClass=()=>{const n=curClass()?.name||'',m=n.trim().match(/^(\d+)(.*)$/),r=n.trim().match(/^(VIII|VII|VI|IV|V|III|II|I)(.*)$/i);
  if(m)return{num:+m[1],name:(+m[1]+1)+m[2]};if(r){const i=ROM.indexOf(r[1].toUpperCase());return{num:i,name:ROM[i+1]+r[2]}}return{num:0,name:''}};
const promoAuto=id=>failed(id)?'not':nextClass().num>=8?'grad':dist(id)?'promo_d':'promo';
const promoOf=id=>CD[id]?.promo||promoAuto(id);
const attOf=id=>{const a=ATT[id]||[];return{abs:a.filter(x=>x.status==='absent').length,exc:a.filter(x=>x.status==='excused').length,late:a.filter(x=>x.status==='late').length}};
const wych=()=>P[curClass()?.homeroom_teacher_id];
const dyr=()=>Object.values(P).find(p=>p.role==='director');
const status=id=>{const m=missing(id),cd=CD[id]||{};return failed(id)?'e':(m||!(cd.birth_date||P[id]?.birth_date)||!cd.birth_place)?'w':''};

   <div class="blk"><div class="h2">Podsumowanie</div><div class="kv"><div>Średnia ocen<b>${av!==null?av.toFixed(2).replace('.',','):'-'}</b></div><div>Zachowanie<b style="font-size:11pt">${esc(beh)}</b></div>${cd.hideAtt?'':`<div>Godz. usprawiedliwione<b>${ac.exc}</b></div><div>Godz. nieusprawiedliwione<b>${ac.abs}</b></div>`}</div></div>
   <div class="blk"><div class="h2">Szczególne osiągnięcia</div>${(cd.ach||[]).filter(x=>x.trim()).length?`<ul class="al">${cd.ach.filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div style="font-size:10pt;color:#6b7491">-</div>'}</div>
   <div class="blk"><div class="h2">Rozstrzygnięcie Rady Pedagogicznej</div><div class="promo">${promoTxt(promoOf(id),id)}</div></div>
   <div class="where">${where}</div>
   <div class="sig"><div><div class="l">${esc(w?nm(w.id):'')}<br>Wychowawca klasy</div></div>${withForm?'<div style="display:flex;justify-content:center"><div class="stamp">miejsce na<br>pieczęć szkoły</div></div>':'<div></div>'}<div><div class="l">${esc(d?nm(d.id):'')}<br>Dyrektor szkoły</div></div></div>
   <div style="margin-top:12mm;font-size:8pt;color:#3b4468;width:75mm"><div style="border-top:.3mm solid #14193a;padding-top:1.5mm">Podpis rodzica / opiekuna prawnego<br>(potwierdzenie odbioru)</div></div>
   <div class="foot">Dokument wygenerowany na podstawie danych z dziennika elektronicznego Minerva. Ważny po opatrzeniu pieczęcią szkoły i podpisami.</div></div>${withForm?'<div class="serial">MINERVA · 2/2</div>':''}</section>`;
  return {p1,p2}}
function fitPv(){const w=$('#pv');if(!w)return;const s=Math.min(1.1,(w.clientWidth-32)/794);$$('.pvw').forEach(e=>{e.style.width=794*s+'px';e.style.height=1118*s+'px';e.firstElementChild.style.transform=`scale(${s})`})}
function renderPv(){
  const id=stu,box=$('#pv');if(!id){box.innerHTML='';return}
  const wf=$('#frm').checked,h=certHTML(id,wf);
  box.innerHTML=`<div class="pvtabs"><button class="${pvMode==='both'?'btn':'gh'} sm" onclick="pvM('both')">Obie strony</button><button class="${pvMode==='1'?'btn':'gh'} sm" onclick="pvM('1')">Strona 1</button><button class="${pvMode==='2'?'btn':'gh'} sm" onclick="pvM('2')">Strona 2</button><span class="sp"></span><button class="btn am sm" onclick="printOne()">🖨 Drukuj tego ucznia</button></div>
  ${pvMode!=='2'?`<div class="pvw"><div class="pvs" style="width:794px">${h.p1}</div></div>`:''}${pvMode!=='1'?`<div class="pvw"><div class="pvs" style="width:794px">${h.p2}</div></div>`:''}`;
  fitPv()}
const pvM=m=>{pvMode=m;renderPv()};

/* ---------- drukowanie ---------- */
async function doPrint(ids){
  if(!ids.length)return warn('Zaznacz przynajmniej jednego ucznia.');
  const probl=ids.filter(i=>status(i)!=='').length;
  if(probl&&!confirm(`Dla ${probl} z ${ids.length} uczniów brakuje danych (oceny, data lub miejsce urodzenia) albo jest ocena niedostateczna. Drukować mimo to?`))return;
  if(!ISSUE.place&&!confirm('Nie wpisano miejscowości wydania. Drukować bez niej?'))return;
  const wf=$('#frm').checked,root=$('#printRoot');
  root.innerHTML=ids.map(i=>{const h=certHTML(i,wf);return h.p1+h.p2}).join('');
  try{await document.fonts.ready;await Promise.all([...root.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r})))}catch{}
  const clear=()=>{root.innerHTML='';removeEventListener('afterprint',clear)};addEventListener('afterprint',clear);
  setTimeout(()=>window.print(),150)}
const printOne=()=>doPrint([stu]),printSel=()=>doPrint(students().map(s=>s.id).filter(i=>sel.has(i)));

/* ---------- zasady zachowania ---------- */
function rulesModal(){
  const R=RULES,f=(k,l)=>`<div><label class="lb">${l}</label><input type="number" id="rl_${k}" value="${R[k]}"></div>`;
  modal(`<div class="box"><h3>Zasady oceniania zachowania</h3><p class="mu" style="font-size:.82rem;margin-top:0">Ocena jest proponowana automatycznie: punkty startowe + (pochwały × punkty) − (uwagi × punkty). Wychowawca zawsze może zmienić ocenę ręcznie przy uczniu.</p>
  <div class="row2">${f('start','Punkty startowe')}<div></div>${f('plus','Punkty za pochwałę (+)')}${f('minus','Punkty za uwagę (−)')}</div>
  <h4 style="margin:.9rem 0 0;color:var(--in);font-size:.9rem">Progi punktowe (od ilu punktów)</h4>
  <div class="row2">${f('wz','Wzorowe od')}${f('bdb','Bardzo dobre od')}${f('db','Dobre od')}${f('pop','Poprawne od')}${f('nieo','Nieodpowiednie od')}<div><label class="lb">Naganne</label><div class="mu" style="font-size:.82rem;padding:.5rem 0">poniżej progu „nieodpowiednie”</div></div></div>
  <div style="display:flex;gap:.5rem;justify-content:space-between;margin-top:1rem"><button class="gh" onclick="rulesReset()">Przywróć domyślne</button><div style="display:flex;gap:.5rem"><button class="gh" onclick="closeModal()">Anuluj</button><button class="btn" onclick="rulesSave()">Zapisz</button></div></div></div>`)}
function rulesSave(){const n={};for(const k of Object.keys(DEF_RULES)){const v=+$('#rl_'+k).value;if(!Number.isFinite(v))return warn('Wpisz poprawne liczby.');n[k]=v}
  if(!(n.wz>n.bdb&&n.bdb>n.db&&n.db>n.pop&&n.pop>n.nieo))return warn('Progi muszą maleć: wzorowe > bardzo dobre > dobre > poprawne > nieodpowiednie.');
  RULES=n;LSset('cert_rules',n);closeModal();toast('Zapisano zasady');renderAll()}
const rulesReset=()=>{RULES={...DEF_RULES};LSset('cert_rules',RULES);closeModal();toast('Przywrócono domyślne zasady');renderAll()};

boot().catch(e=>{hideSplash();fatal('Błąd uruchamiania',e.message||String(e))});
</script>
